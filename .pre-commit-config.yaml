# Pre-commit hooks configuration
# Mirrors the checks performed in .github/workflows/ci.yml
# See https://pre-commit.com for more information
#
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # General file cleanups
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(backend/.*migrations/|frontend/.*)
      - id: end-of-file-fixer
        exclude: ^(backend/.*migrations/|frontend/.*)
      - id: check-yaml
        # Helm chart templates contain Go templating syntax ({{ ... }}) that
        # is not valid YAML until rendered.
        exclude: ^deploy/helm/.*/templates/
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key

  # Delegate backend linting to CI's authoritative script; its header documents
  # tool provisioning, versions and working-directory behavior. The shared
  # input pattern also reruns these whole-tree checks when their inputs change.
  # One hook per check keeps `pre-commit run isort` and `SKIP=flake8` working.
  - repo: local
    hooks:
      - id: black
        name: black (scripts/ci-lint.sh)
        entry: scripts/ci-lint.sh black
        language: system
        files: &backend_lint_inputs ^(backend/|scripts/ci-lint\.sh$|\.gitignore$)
        pass_filenames: false
      - id: isort
        name: isort (scripts/ci-lint.sh)
        entry: scripts/ci-lint.sh isort
        language: system
        files: *backend_lint_inputs
        pass_filenames: false
      - id: flake8
        name: flake8 (scripts/ci-lint.sh)
        entry: scripts/ci-lint.sh flake8
        language: system
        files: *backend_lint_inputs
        pass_filenames: false

  # Backend: Security checks - Bandit
  - repo: https://github.com/PyCQA/bandit
    # Keep in step with the bandit pin in backend/requirements-dev.txt, which
    # is what CI runs. Renovate does not bump pre-commit revs, so this one is
    # manual. 1.7.6 predates Python 3.14 support: its B104-B108 and B608
    # plugins fail to load there, so the B105/B106 skips below read as
    # "Unknown test" and bandit exits before scanning.
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^backend/
        exclude: ^(backend/.*migrations/|backend/.*tests.*)
        # The recursive `backend` target already covers every file, so the
        # staged filenames pre-commit would append are redundant; not passing
        # them keeps the scan identical to CI whichever files are staged.
        pass_filenames: false
        # Match CI invocation in .github/workflows/ci.yml: skip B101
        # (assert_used), B105 (hardcoded_password_string), B106
        # (hardcoded_password_funcarg), and B308 (mark_safe); exclude
        # tests and migrations from the recursive scan so local
        # pre-commit and CI surface the same set of findings.
        args:
          [
            "-r",
            "-s",
            "B101,B105,B106,B308",
            "-x",
            "*/tests/*,*/migrations/*",
            "backend",
          ]

  # Backend: Security checks - pip-audit (dependency vulnerabilities)
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: bash -c 'cd backend && pip-audit --desc || echo "⚠️  pip-audit not available, skipping..."'
        language: system
        files: ^backend/requirements.*\.txt$
        pass_filenames: false
        always_run: false

  # Backend: Django-specific checks
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.16.0
    hooks:
      - id: django-upgrade
        files: ^backend/
        args: ["--target-version", "4.2"]

  # Frontend: Verify package-lock.json is in sync
  - repo: local
    hooks:
      - id: npm-lock-check
        name: npm package-lock.json sync check
        entry: bash -c 'cd frontend && npm ci --dry-run || (echo "package-lock.json is out of sync. Run cd frontend && npm install" && exit 1)'
        language: system
        files: ^frontend/package\.json$
        pass_filenames: false
        always_run: false

  # Delegate frontend linting to CI's authoritative script; its header owns the
  # dependency and version contract. The shared input pattern also reruns these
  # whole-tree checks when their inputs change.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (scripts/ci-lint.sh)
        entry: scripts/ci-lint.sh eslint
        language: system
        files: &frontend_lint_inputs ^(frontend/|scripts/ci-lint\.sh$)
        pass_filenames: false
      - id: typescript-check
        name: TypeScript compilation check (scripts/ci-lint.sh)
        # Trust tsc's exit status rather than counting matching lines, which
        # passed on errors outside src/.
        entry: scripts/ci-lint.sh typecheck
        language: system
        files: *frontend_lint_inputs
        pass_filenames: false
      - id: derivation-guard
        name: settlement derivation guard (scripts/ci-lint.sh)
        # Mirror the scan roots and rerun when the shared script changes.
        entry: scripts/ci-lint.sh derivation-guard
        language: system
        files: ^(backend/.*\.py|frontend/src/.*\.(ts|tsx)|scripts/ci-lint\.sh)$
        pass_filenames: false

  # Frontend: Run tests (optional - can be slow, comment out if needed)
  - repo: local
    hooks:
      - id: npm-test
        name: npm test
        entry: bash -c 'cd frontend && npm run test:ci:coverage'
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
        always_run: false

  # Commit message lint (Conventional Commits).
  # Hook stage: commit-msg. Activated by `pre-commit install --hook-type commit-msg`
  # which is what `make setup-dev` and scripts/setup-dev.sh run.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
