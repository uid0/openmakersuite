

services:
  db:
    image: postgres:18-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=makerspace_inventory
      - POSTGRES_USER=makerspace
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-development_password_only}
      # pg18 alpine changed the on-disk layout (docker-library/postgres#1259);
      # nesting PGDATA in a subdir of the mount keeps the volume path valid
      # AND gives the image a clean dir to initialize the new layout into.
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makerspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
      # The CI docker job runs pytest in here, where backend/ is mounted at
      # /app and the repo root is not on disk, so a test resolving a
      # repo-root path lands on `/<dir>`. `config/tests/test_protected_media.py`
      # reads the nginx template the same way `test_celery_task_inventory.py`
      # reads /docs — without this mount it cannot check the half of the
      # media gate that Django does not enforce.
      - ./nginx:/nginx:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://makerspace:${POSTGRES_PASSWORD:-development_password_only}@db:5432/makerspace_inventory
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://makerspace:${POSTGRES_PASSWORD:-development_password_only}@db:5432/makerspace_inventory
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  firmware_builder:
    # Self-hosted firmware build worker. Opt-in (compose profile) — it carries
    # git + PlatformIO and consumes the dedicated `builds` queue that
    # forgekey.tasks.build_firmware is routed to. Start with:
    #   FORGEKEY_DEPLOY_KEY=/abs/path/to/forgekey_deploy_key \
    #     docker compose --profile firmware-build up -d firmware_builder
    # See docs/FORGEKEY_FIRMWARE_BUILD.md.
    profiles: ["firmware-build"]
    build:
      context: ./backend
      dockerfile: Dockerfile.firmware-builder
    command: celery -A config worker -Q builds --concurrency=1 -l info
    volumes:
      - ./backend:/app
      - media_volume:/app/media
      # Read-only SSH deploy key with read access to the ForgeKey repo.
      - ${FORGEKEY_DEPLOY_KEY:-/dev/null}:/root/.ssh/id_ed25519:ro
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://makerspace:${POSTGRES_PASSWORD:-development_password_only}@db:5432/makerspace_inventory
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FORGEKEY_FIRMWARE_REPO_URL=${FORGEKEY_FIRMWARE_REPO_URL:-git@github.com:uid0/ForgeKey.git}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    # Periodic-task scheduler. Without this, CELERY_BEAT_SCHEDULE entries
    # never fire — most visibly, mark_stale_devices_offline never runs and
    # ForgeKey devices show is_online=True forever after first contact.
    # In-memory schedule state (no --schedule path) is fine for dev; on
    # container restart the timers reset, which is OK since dev sessions
    # are short.
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://makerspace:${POSTGRES_PASSWORD:-development_password_only}@db:5432/makerspace_inventory
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config flower --port=5555 --broker=redis://redis:6379/0 --broker_api=redis://redis:6379/0
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://makerspace:${POSTGRES_PASSWORD:-development_password_only}@db:5432/makerspace_inventory
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_GIT_HASH=${GIT_HASH:-dev}
      - VITE_GITHUB_URL=${GITHUB_URL:-https://github.com/uid0/openmakersuite}
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
