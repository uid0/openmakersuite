[tool.black]
line-length = 100
target-version = ['py313']
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | staticfiles
  | media
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
known_django = "django"
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
skip = ["migrations", "venv", "env", ".venv"]

# Pytest configuration lives in backend/pytest.ini — the single source of truth
# for testpaths, coverage apps, the fail-under threshold, and markers. Keeping
# pytest config out of pyproject.toml avoids the "WARNING: ignoring pytest
# config in pyproject.toml!" drift that bit gh-460 / oms-8q38.
