{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oms.fullname" . }}
  labels:
    {{- include "oms.labels" . | nindent 4 }}
type: Opaque
stringData:
  django-secret-key: {{ required "secrets.djangoSecretKey is required when secrets.create=true" .Values.secrets.djangoSecretKey | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required when secrets.create=true" .Values.secrets.postgresPassword | quote }}
  emqx-dashboard-password: {{ .Values.secrets.emqxDashboardPassword | quote }}
  emqx-api-key: {{ .Values.secrets.emqxApiKey | quote }}
  emqx-api-secret: {{ .Values.secrets.emqxApiSecret | quote }}
  mqtt-broker-username: {{ .Values.secrets.mqttBrokerUsername | quote }}
  mqtt-broker-password: {{ .Values.secrets.mqttBrokerPassword | quote }}
  forgekey-firmware-signing-key: {{ .Values.secrets.forgekeyFirmwareSigningKey | quote }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | quote }}
{{- end }}
