# Postgres superuser credential consumed by the bundled StatefulSet.
# Skip this Secret entirely (and the postgres-statefulset / postgres-service
# / secret-database files) when pointing at a managed database. The
# external-services overlay does that for you.
apiVersion: v1
kind: Secret
metadata:
  name: oms-postgresql
  namespace: openmakersuite
  labels:
    app.kubernetes.io/name: openmakersuite
    app.kubernetes.io/part-of: openmakersuite
    app.kubernetes.io/component: postgresql
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  postgres-password: "REPLACE_ME_WITH_32_CHAR_RANDOM_STRING"
