apiVersion: apps/v1
kind: Deployment
metadata:
  name: oms-redis
  namespace: openmakersuite
  labels:
    app.kubernetes.io/name: openmakersuite
    app.kubernetes.io/part-of: openmakersuite
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  strategy:
    # Recreate (not RollingUpdate) so the old pod releases the PVC before
    # the new one tries to mount it — RWO volumes can't be shared.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openmakersuite
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmakersuite
        app.kubernetes.io/part-of: openmakersuite
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "redis:7.4.8-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Defaults to ephemeral storage — Redis only holds Celery broker
        # state and cached responses. Swap in a PersistentVolumeClaim if
        # the deployment uses Redis for anything that must survive a pod
        # restart.
        - name: data
          emptyDir: {}
