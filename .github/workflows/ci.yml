name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# What follows the changes job uses path filters to skip expensive jobs on
# doc-only changes. Branch protection still requires "✅ CI Complete", which
# treats skipped jobs as a pass when they were correctly skipped.

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      deploy: ${{ steps.filter.outputs.deploy }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # On push events the action diffs against the previous commit; on PRs
          # against the merge base. base/ref is auto-detected.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.pre-commit-config.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - 'docker-compose.prod.yml'
              - 'docker-compose.yml'
              - '.env.prod.example'
              - '.env.example'
              - 'deploy.sh'
              - 'scripts/**'
              - 'nginx/**'
              - '.github/workflows/ci.yml'
            security:
              - 'backend/**'
              - 'frontend/**'
              - '.gitleaks.toml'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install lint dependencies
        run: |
          cd backend
          pip install --upgrade pip
          # Pull just the lint tools we need; mirrors versions in requirements-dev.txt.
          pip install black isort flake8

      - name: Check code formatting with black
        run: cd backend && black --check .

      - name: Check import sorting with isort
        run: cd backend && isort --check-only .

      - name: Lint with flake8
        run: cd backend && flake8 .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test_makerspace_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check for migration drift
        run: |
          # Fails if any app has model changes not reflected in a committed
          # migration. Prevents PRs that edit models without running
          # `manage.py makemigrations` from merging.
          cd backend
          python manage.py makemigrations --check --dry-run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: 1
          ALLOWED_HOSTS: localhost,127.0.0.1
          REDIS_URL: redis://localhost:6379/0

      - name: Check for conflicting migration leaves
        run: |
          # Fails when an app's migration graph has more than one leaf node —
          # e.g. two PRs each branch a 0079 migration off 0078 and both land,
          # leaving 0079_a and 0079_b as siblings. Django's `migrate` aborts at
          # startup on such a graph ("multiple leaf nodes"), so on 2026-07-08
          # this turned into a prod deploy outage that failed every deploy until
          # the 0080 merge migration landed (PR #864). The drift check above
          # also trips on this today, but only as a side effect of graph
          # loading; this is the explicit, named gate that tells a developer to
          # run `makemigrations --merge`. It reads the on-disk graph only (no
          # DB) — see backend/config/management/commands/check_migration_conflicts.py.
          #
          # IMPORTANT: this only sees the conflict when CI evaluates a tree that
          # contains BOTH leaves. GitHub already runs PR CI against the
          # PR-merged-into-base ref, but a stale PR is merged against an old
          # base. Enable branch protection "Require branches to be up to date
          # before merging" so a PR adding 0079 is rebased onto a main that
          # already has the other 0079 (and CI re-runs) before the merge button
          # unlocks. That branch-protection setting is what makes this gate fire.
          cd backend
          python manage.py check_migration_conflicts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: 1
          ALLOWED_HOSTS: localhost,127.0.0.1
          REDIS_URL: redis://localhost:6379/0

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --no-input
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: 1
          ALLOWED_HOSTS: localhost,127.0.0.1
          REDIS_URL: redis://localhost:6379/0

      - name: Run tests with coverage
        run: |
          cd backend
          pytest -n auto
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: 1
          ALLOWED_HOSTS: localhost,127.0.0.1
          REDIS_URL: redis://localhost:6379/0

      - name: Validate OpenAPI schema (AC-10)
        run: |
          # Generate the schema with structural OpenAPI 3 validation. A
          # validation failure exits non-zero and fails this job. The
          # backend test suite (config/tests/test_schema.py) additionally
          # asserts that critical workflow paths remain in the contract.
          cd backend
          python manage.py spectacular \
            --validate \
            --file /tmp/openapi-schema.yaml
          # Sanity check: a non-empty file means generation succeeded.
          test -s /tmp/openapi-schema.yaml
          echo "✅ OpenAPI schema generated and validated ($(wc -c < /tmp/openapi-schema.yaml) bytes)"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: 1
          ALLOWED_HOSTS: localhost,127.0.0.1
          REDIS_URL: redis://localhost:6379/0

      - name: Upload OpenAPI schema artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: /tmp/openapi-schema.yaml
          if-no-files-found: ignore

      - name: Verify coverage file exists
        run: |
          if [ ! -f backend/coverage.xml ]; then
            echo "❌ backend/coverage.xml not found!"
            ls -la backend/ | grep -i coverage || echo "No coverage files found"
            exit 1
          fi
          echo "✓ Coverage file verified"
          ls -lh backend/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          name: backend-coverage

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --ignore-scripts
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"

      - name: Run eslint
        run: |
          cd frontend
          npm run lint

      - name: Check no site bypasses the settlement derivation
        run: |
          # The web UI can decide whether a purchase-order line is settled
          # client-side just as easily as the backend can, and a frontend-only
          # PR skips Backend Tests entirely — where this same check runs as
          # reorder_queue/tests/test_settlement_sites.py. Running it here too is
          # what stops the guard having a hole exactly the size of "only
          # touched the frontend".
          #
          # Stdlib-only and Django-free on purpose, so it needs no backend
          # environment: see backend/reorder_queue/settlement_sites.py.
          python3 backend/reorder_queue/settlement_sites.py

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify package-lock.json is in sync
        run: |
          cd frontend
          # Check if package-lock.json exists
          if [ ! -f "package-lock.json" ]; then
            echo "❌ Error: package-lock.json not found"
            exit 1
          fi
          echo "🔍 Verifying package-lock.json is in sync with package.json..."
          # --ignore-scripts skips postinstall (patch-package), which isn't on
          # PATH before the real install. Lock sync doesn't need scripts.
          npm ci --dry-run --ignore-scripts || (echo "❌ package-lock.json is out of sync with package.json. Run 'npm install' in frontend/ and commit the updated lock file." && exit 1)
          echo "✅ package-lock.json is in sync"

      - name: Install dependencies
        run: |
          cd frontend
          # Force IPv4 only for npm operations (via .npmrc and NODE_OPTIONS)
          npm ci --verbose
          # Verify installation
          ls -la node_modules/.bin/vite || (echo "❌ vite not found after npm ci!" && exit 1)
          npm ls @mantine/core @mantine/modals html5-qrcode recharts react-grid-layout
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:ci:coverage
        env:
          CI: true
          NODE_OPTIONS: "--dns-result-order=ipv4first"

      - name: Build production bundle
        run: |
          cd frontend
          # Vite source maps are on by default (vite.config.ts: build.sourcemap=true),
          # so build/ ends up with `assets/index-*.js.map` siblings ready for upload.
          npm run build
        env:
          CI: false
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          VITE_GIT_HASH: ${{ github.sha }}

      - name: Register Sentry release + upload frontend source maps
        # Creates a single org-wide release identified by the commit SHA,
        # associated with both projects so backend (Python) errors and
        # frontend (React + Replay) events both link back to the same
        # commit + diff. Upload the frontend assets/*.js.map so minified
        # stack traces resolve to real TS lines.
        #
        # The `secrets` context is NOT available inside step-level `if:`
        # expressions, so the step itself always runs — but its body bails
        # immediately when SENTRY_AUTH_TOKEN is unset (PRs from forks,
        # local act runs, fresh-clone builds before the secret is set up).
        # `continue-on-error: true` so a Sentry outage or transient API
        # failure never fails CI — releases are best-effort metadata, not
        # a deploy gate.
        continue-on-error: true
        run: |
          cd frontend
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "⏭️  SENTRY_AUTH_TOKEN not set; skipping Sentry release + sourcemap upload."
            exit 0
          fi
          # Match the release identifier the rest of the stack uses.
          # deploy.sh exports `GIT_HASH=$(git rev-parse --short HEAD)`, the
          # frontend bundle bakes that via VITE_GIT_HASH, and the backend
          # Python SDK reads it as SENTRY_RELEASE. CI was using
          # $GITHUB_SHA (40-char) which never matched the 7-char value
          # events report — releases stayed empty and source-maps
          # uploaded against the wrong identifier never resolved.
          RELEASE_SHA="${GITHUB_SHA:0:7}"
          echo "Sentry release: $RELEASE_SHA"
          SCLI="npx --yes @sentry/cli@2.39.1"
          $SCLI releases new "$RELEASE_SHA" --project backend --project frontend
          $SCLI releases files "$RELEASE_SHA" \
            upload-sourcemaps build/assets \
            --url-prefix "~/assets" \
            --rewrite \
            --validate \
            --project frontend
          $SCLI releases set-commits "$RELEASE_SHA" --auto --commit "uid0/openmakersuite@$GITHUB_SHA"
          $SCLI releases finalize "$RELEASE_SHA"
        env:
          SENTRY_URL: https://highlighter.openmakersuite.net
          SENTRY_ORG: sentry
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify coverage files exist
        run: |
          cd frontend
          if [ ! -f coverage/clover.xml ]; then
            echo "❌ clover.xml not found!"
            exit 1
          fi
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ lcov.info not found!"
            exit 1
          fi
          echo "✓ Coverage files verified"
          ls -lh coverage/clover.xml coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./frontend/coverage/clover.xml,./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  e2e-tests:
    # AC-21 / gh-456: Playwright runs against a live Django backend +
    # built SPA in CI so the suite is a real product-confidence gate, not
    # an advisory signal. This job intentionally has no continue-on-error
    # — a Playwright failure here blocks the PR.
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: test_makerspace_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # DEBUG=1 enables /api/auth/test-membership/ which the e2e fixtures
      # use to grant active memberships to seeded users. Without it, login
      # fails for newly-registered users and every spec skips.
      DEBUG: 1
      SECRET_KEY: test-secret-key-for-ci-only
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
      # Close DB connections after each request. The single --noreload
      # runserver process otherwise piles up persistent connections
      # against postgres `max_connections=100` and the suite eventually
      # hits FATAL: sorry, too many clients already on later specs.
      DJANGO_CONN_MAX_AGE: 0
      REDIS_URL: redis://localhost:6379/0
      # settings.py defaults CELERY_BROKER_URL to a hardcoded private IP
      # (192.168.1.36) when neither this env var nor TESTING mode is set.
      # Without this override, every endpoint that calls `.delay()`
      # (asset.report_problem → send_asset_problem_webhook etc.) hangs
      # on the broker connect and the test fires at 15s with the submit
      # button still reading "Submitting...".
      CELERY_BROKER_URL: redis://localhost:6379/0
      # AC-34 storage_vision E2E needs the feature on AND process_capture
      # running inline (CI has no celery worker). The eager flag is
      # respected in non-TESTING mode by config/settings.py.
      STORAGE_VISION_ENABLED: "true"
      CELERY_TASK_ALWAYS_EAGER: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      PLAYWRIGHT_API_URL: http://localhost:8000/api
      NODE_OPTIONS: "--dns-result-order=ipv4first"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --no-input

      - name: Start Django backend
        run: |
          cd backend
          # --noreload prevents the autoreloader from forking a second
          # process that outlives this step. nohup + disown so the server
          # survives the step boundary; logs go to a file we tail on failure.
          nohup python manage.py runserver 0.0.0.0:8000 --noreload \
            > /tmp/django.log 2>&1 &
          echo $! > /tmp/django.pid
          disown

      - name: Wait for backend /api/health/livez/
        run: |
          deadline=$(( $(date +%s) + 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS http://localhost:8000/api/health/livez/ >/dev/null 2>&1; then
              echo "✅ backend live"
              exit 0
            fi
            sleep 1
          done
          echo "❌ backend did not serve /api/health/livez/ within 60s"
          echo "::group::django.log"
          cat /tmp/django.log || true
          echo "::endgroup::"
          exit 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          CI: false

      - name: Install Playwright browsers (chromium only)
        run: |
          cd frontend
          # CI gate runs chromium only for cycle time; the playwright config
          # still defines firefox + webkit projects so local devs can opt in.
          npx playwright install --with-deps chromium

      - name: Start SPA server
        run: |
          nohup python3 scripts/serve-spa.py frontend/build 3000 \
            > /tmp/spa.log 2>&1 &
          echo $! > /tmp/spa.pid
          disown
          deadline=$(( $(date +%s) + 30 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              echo "✅ SPA server up"
              exit 0
            fi
            sleep 1
          done
          echo "❌ SPA server did not respond on :3000 within 30s"
          cat /tmp/spa.log || true
          exit 1

      - name: Run Playwright (chromium)
        run: |
          cd frontend
          # PLAYWRIGHT_BASE_URL is set at job level, which signals our
          # playwright config to skip its dev-server block — Playwright
          # talks to the SPA server started above instead. CI=true keeps
          # retries=2 and workers=1 from the config active.
          npx playwright test --project=chromium

      - name: Tail backend log on failure
        if: failure()
        run: |
          echo "::group::django.log"
          cat /tmp/django.log || true
          echo "::endgroup::"
          echo "::group::spa.log"
          cat /tmp/spa.log || true
          echo "::endgroup::"

      - name: Stop background servers
        if: always()
        run: |
          kill "$(cat /tmp/django.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/spa.pid 2>/dev/null)" 2>/dev/null || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces/screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Pre-cleanup stale volumes
        run: |
          docker compose down -v 2>/dev/null || true
          docker container prune -f 2>/dev/null || true
          docker volume rm openmakersuite_media_volume openmakersuite_static_volume openmakersuite_postgres_data 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true

      - name: Build and test with docker compose
        env:
          POSTGRES_PASSWORD: test_password_for_ci_only
          # COMPOSE_BAKE delegates `compose build` to `buildx bake`, which
          # parallelizes per-service builds across BuildKit workers
          # instead of running them sequentially. Backend + frontend +
          # nginx (~3 builds today) drop from serial to concurrent.
          COMPOSE_BAKE: "true"
          DOCKER_BUILDKIT: "1"
        run: |
          # Pre-build in parallel, then `up` with --no-build so the
          # serial-build path inside compose-up is skipped. Saves ~1/2
          # of build wall-clock when frontend + backend rebuild together.
          docker compose build --parallel
          docker compose up -d --no-build

          # Wait for services to be healthy
          timeout 300 bash -c 'while [[ "$(docker compose ps -q | xargs docker inspect -f "{{.State.Health.Status}}" 2>/dev/null | grep -v healthy | wc -l)" != "0" ]]; do sleep 5; done'

          # Run migrations
          docker compose exec -T backend python manage.py migrate --no-input

          # Run tests in Docker environment
          docker compose exec -T backend pytest -v

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          docker system prune -f

  security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.security == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for gitleaks

      - name: Set up Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install security tools
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run bandit security check
        run: |
          cd backend
          # Exclude test files and migrations
          # Skip B101 (assert_used - acceptable in tests),
          #      B105 (hardcoded_password_string - noisy on token-handling code),
          #      B106 (hardcoded_password_funcarg - acceptable in test fixtures),
          #      B308 (mark_safe - every call site in this repo is a literal
          #            HTML fragment for admin status icons, not user input;
          #            Django 6 made format_html() reject no-arg calls, forcing
          #            the migration to mark_safe in inventory/membership/
          #            reorder_queue admins)
          # Pattern */tests/* matches all test directories, */migrations/* matches all migration directories
          bandit -r . -x "*/tests/*,*/migrations/*" -s B101,B105,B106,B308 -f json -o bandit-report.json || true
          bandit -r . -x "*/tests/*,*/migrations/*" -s B101,B105,B106,B308

      - name: Check dependencies for vulnerabilities
        run: |
          cd backend
          echo "🔍 Checking for vulnerable dependencies with multiple tools..."

          # Use pip-audit as primary tool (more reliable for CI)
          if pip-audit --format=json --output=safety-report.json --desc; then
            echo "✅ pip-audit completed successfully"
            pip-audit --desc  # Show readable output
          else
            echo "⚠️  pip-audit failed, trying safety as fallback..."

            # Use safety check (deprecated but works without auth)
            if safety check --json --output=safety-report.json 2>/dev/null; then
              echo "✅ Safety check completed successfully"
              safety check --short-report 2>/dev/null || safety check
            else
              echo "⚠️  Both pip-audit and safety encountered issues"
              echo "Creating minimal report for CI continuation..."
              echo '{"vulnerabilities": [], "info": "Vulnerability scanning tools encountered compatibility issues"}' > safety-report.json
            fi
          fi

      - name: Install gitleaks
        run: |
          wget https://github.com/zricethezav/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks_8.18.0_linux_x64.tar.gz

      - name: Run gitleaks scan
        run: |
          # Run gitleaks with our configuration (works with both GitHub Actions and act)
          if [ -f .gitleaks.toml ]; then
            echo "✓ Using custom gitleaks configuration (.gitleaks.toml)"
            gitleaks detect --config .gitleaks.toml --verbose --no-git
          else
            echo "⚠ Using default gitleaks configuration (no .gitleaks.toml found)"
            gitleaks detect --verbose --no-git
          fi
          echo "✅ Gitleaks scan completed successfully"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  deploy-artifacts:
    name: Deploy Artifacts (Compose + Scripts + Env)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Lint shell scripts (bash -n)
        run: |
          # Syntax-check every shell script we ship. AC-36: CI must catch a
          # broken deploy.sh / smoke / backup / restore script before merge.
          fail=0
          while IFS= read -r script; do
            echo "→ $script"
            if ! bash -n "$script"; then
              echo "❌ syntax error in $script"
              fail=1
            fi
          done < <(find . \
              -path './node_modules' -prune -o \
              -path './frontend/node_modules' -prune -o \
              -path './backend/.venv' -prune -o \
              \( -name '*.sh' -type f \) -print | sort)
          [ "$fail" = 0 ]

      - name: restore-drill.sh dry-run (AC-25)
        run: |
          # AC-25 stage 1: the drill orchestrator must parse and verify its
          # dependency scripts (backup-db.sh, restore-db.sh, smoke.sh) without
          # touching the database. Catches accidental regressions on the
          # operator-facing drill script in environments where Docker isn't
          # available (this job runs on a plain ubuntu-latest).
          bash scripts/restore-drill.sh --dry-run

      - name: Render docker-compose.prod.yml
        run: |
          # Confirm the compose file parses and resolves all variables. We
          # supply minimal stand-in env values so `compose config` doesn't
          # bail on unresolved `${...}` references — the goal is syntax +
          # template validation, not real-deploy values.
          set -e
          cat > .env <<'EOF'
          DOMAIN=ci.example.com
          LETSENCRYPT_EMAIL=ci@ci.example.com
          LETSENCRYPT_DOMAINS=ci.example.com
          DEBUG=0
          SECRET_KEY=ci-secret-key-not-for-production-only-for-compose-render-validation
          ALLOWED_HOSTS=ci.example.com
          CSRF_TRUSTED_ORIGINS=https://ci.example.com
          CORS_ALLOWED_ORIGINS=https://ci.example.com
          POSTGRES_DB=oms
          POSTGRES_USER=oms
          POSTGRES_PASSWORD=ci-password-1234567890
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          FRONTEND_URL=https://ci.example.com
          GIT_HASH=ci
          GITHUB_URL=https://github.com/uid0/openmakersuite
          EMQX_DASHBOARD_PASSWORD=Strong1Password
          EOF
          docker compose -f docker-compose.prod.yml --env-file .env config -q
          docker compose -f docker-compose.yml config -q
          rm -f .env

      - name: deploy.sh loads .env with a multiline PEM JWT key
        run: |
          # oms-eqvnc / gh #311: deploy.sh used `export $(cat .env | xargs)`,
          # which word-splits values whose first token contains whitespace
          # (e.g. an EC PEM header) and aborts the script on the first such
          # variable. Vars *after* it never get exported, so the subsequent
          # EMQX_DASHBOARD_PASSWORD complexity check appears to fail with
          # empty input. This step builds a .env containing a real
          # ec-prime256v1 PEM rendered with the awk recipe documented in
          # .env.prod.example, runs deploy.sh up through the env-load block,
          # and asserts every variable (including ones placed after the JWT
          # key) gets exported.
          set -e
          workdir=$(mktemp -d)
          cp deploy.sh "$workdir/deploy.sh"
          mkdir -p "$workdir/scripts"
          cat > "$workdir/scripts/validate-prod-env.sh" <<'EOF'
          #!/bin/bash
          exit 0
          EOF
          chmod +x "$workdir/scripts/validate-prod-env.sh"

          jwt_pem=$(openssl ecparam -genkey -name prime256v1 -noout)
          jwt_env=$(printf '%s' "$jwt_pem" | awk '{printf "%s\\n", $0}')
          cat > "$workdir/.env" <<EOF
          # leading comment
          DOMAIN=ci.example.com
          POSTGRES_USER=oms
          POSTGRES_DB=oms
          FORGEKEY_JWT_SIGNING_KEY=${jwt_env}
          EMQX_DASHBOARD_PASSWORD=Strong1Password
          EMQX_API_KEY=ci-api-key-loaded-after-jwt
          EMQX_API_SECRET=ci-api-secret-loaded-after-jwt
          EOF

          # Truncate deploy.sh after the env-load block, stub `git pull`,
          # then echo the variables we need to assert.
          sed -i '1,/^done < \.env$/!d' "$workdir/deploy.sh"
          sed -i 's|^git pull$|: # git pull stubbed for env-load test|' "$workdir/deploy.sh"
          cat >> "$workdir/deploy.sh" <<'EOF'
          unset raw_line env_key env_value
          printf 'ASSERT_DOMAIN=%s\n' "$DOMAIN"
          printf 'ASSERT_EMQX_DASHBOARD_PASSWORD=%s\n' "$EMQX_DASHBOARD_PASSWORD"
          printf 'ASSERT_EMQX_API_KEY=%s\n' "$EMQX_API_KEY"
          printf 'ASSERT_EMQX_API_SECRET=%s\n' "$EMQX_API_SECRET"
          printf 'ASSERT_JWT_LEN=%s\n' "${#FORGEKEY_JWT_SIGNING_KEY}"
          EOF

          ( cd "$workdir" && bash deploy.sh ) > "$workdir/out" 2>&1 || {
              echo "❌ deploy.sh aborted while loading .env with a multiline PEM"
              cat "$workdir/out"
              exit 1
          }

          assert_eq() {
              local key="$1" expected="$2"
              local got
              got=$(grep "^${key}=" "$workdir/out" | head -1 | cut -d= -f2-)
              if [ "$got" != "$expected" ]; then
                  echo "❌ $key: expected '$expected', got '$got'"
                  cat "$workdir/out"
                  exit 1
              fi
          }
          assert_eq ASSERT_DOMAIN                ci.example.com
          assert_eq ASSERT_EMQX_DASHBOARD_PASSWORD Strong1Password
          assert_eq ASSERT_EMQX_API_KEY          ci-api-key-loaded-after-jwt
          assert_eq ASSERT_EMQX_API_SECRET       ci-api-secret-loaded-after-jwt
          jwt_len=$(grep '^ASSERT_JWT_LEN=' "$workdir/out" | head -1 | cut -d= -f2-)
          if [ "${jwt_len:-0}" -lt 100 ]; then
              echo "❌ FORGEKEY_JWT_SIGNING_KEY length $jwt_len < 100, value got truncated"
              cat "$workdir/out"
              exit 1
          fi
          echo "✅ deploy.sh loads .env with multiline PEM (vars after JWT key all set, JWT len=$jwt_len)"

      - name: Run prod env validator against happy-path env
        run: |
          # Drive scripts/validate-prod-env.sh with a synthesised env that
          # should pass. If the validator regresses to false-positive on
          # safe inputs, this catches it.
          cat > /tmp/good.env <<'EOF'
          DOMAIN=ci.example.com
          LETSENCRYPT_EMAIL=ci@ci.example.com
          LETSENCRYPT_DOMAINS=ci.example.com
          DEBUG=0
          SECRET_KEY=ci-secret-key-not-for-production-only-validator-test-padding-padding
          ALLOWED_HOSTS=ci.example.com
          CSRF_TRUSTED_ORIGINS=https://ci.example.com
          CORS_ALLOWED_ORIGINS=https://ci.example.com
          POSTGRES_DB=oms
          POSTGRES_USER=oms
          POSTGRES_PASSWORD=ci-password-1234567890
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          FRONTEND_URL=https://ci.example.com
          EMQX_DASHBOARD_PASSWORD=Strong1Password
          EMAIL_BACKEND=django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST=smtp.example.com
          DEFAULT_FROM_EMAIL=noreply@ci.example.com
          POSTMARK_INBOUND_TOKEN=tok
          LOCATION_PING_TOKEN=tok
          EOF
          bash scripts/validate-prod-env.sh /tmp/good.env

      - name: Validator rejects shipped placeholder env
        run: |
          # The .env.prod.example file MUST fail validation — it contains
          # placeholder secrets by design. If the validator passes it, we
          # have a regression.
          if bash scripts/validate-prod-env.sh .env.prod.example; then
            echo "❌ scripts/validate-prod-env.sh accepted .env.prod.example"
            echo "   Placeholder values must always fail; loosen with care."
            exit 1
          fi
          echo "✅ Validator correctly rejects placeholder env"

      - name: Build production Docker images
        run: |
          # AC-36: production Docker builds must be a CI gate, not just a
          # deploy-time discovery. Build both prod images from scratch.
          docker build -f backend/Dockerfile.prod -t oms-backend:ci backend/
          docker build -f frontend/Dockerfile.prod -t oms-frontend:ci \
              --build-arg VITE_API_URL=/api \
              --build-arg VITE_GIT_HASH=ci \
              --build-arg VITE_GITHUB_URL=https://github.com/uid0/openmakersuite \
              frontend/

  prod-stack-smoke:
    # oms-801 / AC-5: boot the prod docker-compose stack with a minimal env
    # and verify the backend actually serves a request. Production workers
    # timed out at 120s without ever serving a request after the
    # PR #303-#308 batch shipped; this gate would have caught that locally.
    #
    # The livez budget deliberately is NOT part of the job name (op-dwyi).
    # This string is a GitHub *check name* quoted verbatim by
    # docs/PROFICIENCY_METRICS.md and deploy/BACKUP_RESTORE.md §8.1, so a
    # number baked into it drifts those docs every time the budget is tuned.
    name: Prod Stack Smoke (prod compose boot)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true' || needs.changes.outputs.deploy == 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Render minimal prod .env + bootstrap files
        run: |
          # Minimum env that satisfies validate-prod-env.sh + lets the prod
          # compose come up. The forgekey JWT signing key is set to a real
          # ephemeral keypair so a regression that loads it at boot would
          # fail with a malformed-PEM error here, not silently pass.
          jwt_pem=$(openssl ecparam -genkey -name prime256v1 -noout)
          jwt_env=$(printf '%s' "$jwt_pem" | awk '{printf "%s\\n", $0}')

          cat > .env <<EOF
          DOMAIN=ci.example.com
          LETSENCRYPT_EMAIL=ci@ci.example.com
          LETSENCRYPT_DOMAINS=ci.example.com
          DEBUG=0
          SECRET_KEY=ci-secret-key-not-for-production-only-validator-test-padding-padding
          ALLOWED_HOSTS=ci.example.com,localhost,127.0.0.1
          CSRF_TRUSTED_ORIGINS=https://ci.example.com
          CORS_ALLOWED_ORIGINS=https://ci.example.com
          POSTGRES_DB=oms
          POSTGRES_USER=oms
          POSTGRES_PASSWORD=ci-password-1234567890
          REDIS_URL=redis://redis:6379/0
          CELERY_BROKER_URL=redis://redis:6379/0
          FRONTEND_URL=https://ci.example.com
          GIT_HASH=ci
          GITHUB_URL=https://github.com/uid0/openmakersuite
          EMQX_DASHBOARD_PASSWORD=Strong1Password
          FORGEKEY_PROVISIONING_TOKEN=ci-provisioning-token-not-for-production-padding
          FORGEKEY_JWT_SIGNING_KEY=${jwt_env}
          # validate_production runs on container start (gh-710) and would
          # require SECURE_SSL_REDIRECT=1 + SECURE_HSTS_SECONDS>0, but this
          # smoke boots the backend without an nginx TLS terminator — both
          # would loop livez to https forever. The validator has its own
          # unit tests; the escape hatch is the right shape here.
          SKIP_PRODUCTION_VALIDATION=1
          # The new safe-by-default values in settings.py (gh-720 follow-up)
          # turn SSL_REDIRECT on whenever DEBUG=False. Override to 0/0 for
          # this smoke since /api/health/livez/ is hit over plain http
          # inside the backend container — a 301 to https would never
          # complete.
          SECURE_SSL_REDIRECT=0
          SECURE_HSTS_SECONDS=0
          EOF

          # bootstrap_users for EMQX is normally rendered by deploy.sh; the
          # smoke just needs a syntactically valid file so the volume mount
          # doesn't fail.
          mkdir -p scripts/emqx
          echo "admin:Strong1Password" > scripts/emqx/bootstrap-admins.txt

      - name: Build backend image
        run: |
          # Build once, up front, so the migrate step below and the `up -d`
          # after it both reuse the same oms-backend:local image instead of
          # racing an implicit build.
          docker compose -f docker-compose.prod.yml --env-file .env \
              build backend

      - name: Run migrations (off the livez critical path)
        run: |
          # op-dwyi: this job boots against a *fresh* database, and the prod
          # entrypoint migrates before it execs gunicorn. That put "apply the
          # entire migration set" and "boot gunicorn" on one timer, so the
          # livez wait below was really measuring migration count — a budget
          # every new migration ate into, which flaked on unrelated PRs (#957)
          # and had already been bumped 60s -> 120s once (op-mfhh / #948).
          #
          # Migrate here instead, in a one-shot container against the same
          # `db` service (compose honours depends_on, so it waits for the db
          # healthcheck first). The long-running backend container's own
          # entrypoint migrate is then a fast idempotent no-op and the livez
          # step measures only gunicorn coming up — independent of how many
          # migrations the repo has. Same shape as the backend-tests job,
          # which has always had `Run migrations` as its own step before its
          # livez wait.
          docker compose -f docker-compose.prod.yml --env-file .env \
              run --rm backend python manage.py migrate --no-input

      - name: Boot backend stack (db + redis + emqx + backend)
        run: |
          # frontend/nginx are skipped — we only need the API path to verify
          # gunicorn workers boot and serve livez.
          docker compose -f docker-compose.prod.yml --env-file .env \
              up -d db redis emqx backend

      - name: Wait for backend to serve /api/health/livez/
        run: |
          # This budget covers gunicorn boot only — the DB was migrated in its
          # own step above, so it does not grow with the migration count. Keep
          # it tight (same 60s the backend-tests livez wait uses); if it starts
          # flaking, the cause is a real boot regression, not migration drift.
          budget=60
          deadline=$(( $(date +%s) + budget ))
          backend_id=$(docker compose -f docker-compose.prod.yml ps -q backend)
          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Hit livez from inside the backend container so we don't depend
            # on host port mapping or DNS.
            if docker exec "$backend_id" python -c \
                "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/api/health/livez/', timeout=5); import sys; sys.exit(0 if r.status==200 else 1)" \
                2>/dev/null; then
              echo "✅ /api/health/livez/ returned 200 within $(( budget - (deadline - $(date +%s)) ))s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ backend did not serve /api/health/livez/ within ${budget}s"
          # The job-level "Show backend logs on failure" step below dumps
          # backend/db/redis/emqx logs, so no need to repeat them here.
          exit 1

      - name: AC-25 media restore drill (seed → backup → wipe → restore → verify)
        run: |
          # AC-25 (#454) media half: the existing --skip-media flag worked
          # around an empty media volume. Seed a tiny fixture so backup-
          # media.sh has something to tar + restore-media.sh has something
          # to put back, then assert the round-trip preserved the bytes.
          # This is the documented BACKUP_RESTORE.md §3 path end-to-end,
          # CI-gated on every deploy-touching PR.
          backend_id=$(docker compose -f docker-compose.prod.yml ps -q backend)
          FIXTURE_PATH="ac25-fixture/$(date -u +%s).txt"
          FIXTURE_CONTENT="ac25-media-drill-$(date -u +%Y%m%dT%H%M%SZ)"
          docker exec "$backend_id" sh -c \
              "mkdir -p /app/media/ac25-fixture && \
               echo '$FIXTURE_CONTENT' > '/app/media/$FIXTURE_PATH'"

          # Take a fresh media archive of the just-seeded volume.
          bash scripts/backup-media.sh

          # Wipe the seeded file so the restore has something to put back.
          docker exec "$backend_id" rm -rf /app/media/ac25-fixture

          # Find the most recent archive and restore it.
          LATEST=$(ls -t media-backups/oms-media-*.tgz | head -1)
          echo "Restoring from: $LATEST"
          RESTORE_MEDIA_CONFIRM=YES bash scripts/restore-media.sh --force "$LATEST"

          # Re-read after restart; backend container id may have changed.
          backend_id=$(docker compose -f docker-compose.prod.yml ps -q backend)
          RESTORED=$(docker exec "$backend_id" cat "/app/media/$FIXTURE_PATH" 2>&1 | head -1)
          if [ "$RESTORED" = "$FIXTURE_CONTENT" ]; then
            echo "✅ media restore round-trip preserved /app/media/$FIXTURE_PATH"
          else
            echo "❌ media restore round-trip failed"
            echo "expected: $FIXTURE_CONTENT"
            echo "got:      $RESTORED"
            exit 1
          fi

      - name: AC-25 config restore drill (mutate → backup → corrupt → restore → verify)
        run: |
          # AC-25 (gh-454) config half: prove backup-config.sh + restore-
          # config.sh round-trip the .env without losing or corrupting it.
          # The rendered .env is the canonical artifact for this job; mutate
          # it, take a backup of the mutated state, then mutate AGAIN to a
          # 'corrupted' shape and verify restore-config.sh puts the mid
          # state back. This guards against silent extraction failures
          # (e.g. tar version drift) and silent path-traversal regressions.
          ORIG_ENV_HASH=$(sha256sum .env | awk '{print $1}')
          echo "AC25_CONFIG_DRILL_MARKER=$(date -u +%s)" >> .env
          MARKED_HASH=$(sha256sum .env | awk '{print $1}')
          if [ "$ORIG_ENV_HASH" = "$MARKED_HASH" ]; then
            echo "❌ marker append did not change .env hash — fixture broken"
            exit 2
          fi

          # Capture the marked state so we can prove the restore brings
          # it back. Drop the artifact next to the others.
          bash scripts/backup-config.sh

          # Corrupt the working .env. Restore should overwrite this with
          # the marked snapshot and move the corrupt file aside to .bak.
          echo "CORRUPTED=do-not-want" > .env

          LATEST=$(ls -t config-backups/oms-config-*.tar.gz | head -1)
          RESTORE_CONFIG_CONFIRM=YES bash scripts/restore-config.sh --force "$LATEST"

          RESTORED_HASH=$(sha256sum .env | awk '{print $1}')
          if [ "$RESTORED_HASH" = "$MARKED_HASH" ]; then
            echo "✅ config restore round-trip preserved .env bytes exactly"
          else
            echo "❌ config restore round-trip mismatch"
            echo "expected hash: $MARKED_HASH"
            echo "got hash:      $RESTORED_HASH"
            exit 1
          fi

          # Verify the .bak side-file was created so a real operator can
          # roll the change back by hand.
          if ! ls .env.*.bak >/dev/null 2>&1; then
            echo "❌ expected .env.<utc>.bak to exist after restore"
            exit 1
          fi

      - name: AC-25 DB restore drill (backup → restore → livez)
        env:
          # Match the rendered .env used by this job so the drill talks to
          # the same role + database.
          POSTGRES_USER: oms
          POSTGRES_DB: oms
        run: |
          # AC-25 stage 2/3: against the same stack we just proved live,
          # drive scripts/restore-drill.sh end-to-end. --skip-media because
          # the compose stack ships an empty media volume; --skip-smoke
          # because smoke.sh expects the frontend/nginx surfaces, which
          # this job does not boot. After the round-trip, re-prove
          # /api/health/livez/ from inside the backend container so the
          # drill demonstrates the restored stack still serves requests —
          # not just that pg_restore exited 0.
          bash scripts/restore-drill.sh --skip-media --skip-smoke

          # restore-db.sh stops/starts worker services around pg_restore, so
          # the backend can briefly disconnect from the DB. Re-probe livez
          # with a 60s budget — unlike the original livez wait this is only a
          # DB reconnect on an already-migrated stack, so it needs no room for
          # the migration run.
          deadline=$(( $(date +%s) + 60 ))
          backend_id=$(docker compose -f docker-compose.prod.yml ps -q backend)
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if docker exec "$backend_id" python -c \
                "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/api/health/livez/', timeout=5); import sys; sys.exit(0 if r.status==200 else 1)" \
                2>/dev/null; then
              echo "✅ /api/health/livez/ green after restore round-trip"
              exit 0
            fi
            sleep 2
          done
          echo "❌ backend did not re-serve /api/health/livez/ within 60s after restore"
          exit 1

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "::group::backend logs"
          docker compose -f docker-compose.prod.yml logs backend || true
          echo "::endgroup::"
          echo "::group::db logs"
          docker compose -f docker-compose.prod.yml logs db || true
          echo "::endgroup::"
          echo "::group::redis logs"
          docker compose -f docker-compose.prod.yml logs redis || true
          echo "::endgroup::"
          echo "::group::emqx logs"
          docker compose -f docker-compose.prod.yml logs emqx || true
          echo "::endgroup::"

      - name: Cleanup
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml down -v || true

  deploy-validation:
    name: Deploy Validation (Helm + K8s)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'

    env:
      HELM_VERSION: v4.2.1
      KUBECONFORM_VERSION: 0.6.7
      KUBE_VERSION: "1.29.0"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: helm lint (strict)
        run: helm lint --strict deploy/helm/openmakersuite

      - name: helm template — render configurations
        run: |
          mkdir -p /tmp/render
          CHART=deploy/helm/openmakersuite

          echo "::group::default (bundled DB + Redis)"
          helm template oms "$CHART" > /tmp/render/helm-default.yaml
          echo "::endgroup::"

          echo "::group::external database"
          helm template oms "$CHART" \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql://oms:secret@db.example.com:5432/oms \
            > /tmp/render/helm-extdb.yaml
          echo "::endgroup::"

          echo "::group::external redis"
          helm template oms "$CHART" \
            --set redis.enabled=false \
            --set externalRedis.url=redis://redis.example.com:6379/0 \
            > /tmp/render/helm-extredis.yaml
          echo "::endgroup::"

          echo "::group::ingress enabled"
          helm template oms "$CHART" \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            > /tmp/render/helm-ingress.yaml
          echo "::endgroup::"

          echo "::group::persistence disabled"
          helm template oms "$CHART" \
            --set persistence.static.enabled=false \
            --set persistence.media.enabled=false \
            > /tmp/render/helm-nopersist.yaml
          echo "::endgroup::"

          for f in /tmp/render/helm-*.yaml; do
            test -s "$f" || { echo "❌ empty render: $f"; exit 1; }
          done

      - name: helm template — assert configuration shape
        run: |
          fail=0
          assert_kind_count() {
            local file="$1" kind="$2" expected="$3"
            local actual
            actual=$(grep -cE "^kind: ${kind}\$" "$file" || true)
            if [ "$actual" != "$expected" ]; then
              echo "❌ $file: expected $expected '$kind' resource(s), got $actual"
              fail=1
            else
              echo "✓ $file: $actual '$kind' resource(s)"
            fi
          }

          # Default: bundled postgres StatefulSet, no Ingress, both PVCs present.
          assert_kind_count /tmp/render/helm-default.yaml StatefulSet 1
          assert_kind_count /tmp/render/helm-default.yaml Ingress 0
          assert_kind_count /tmp/render/helm-default.yaml PersistentVolumeClaim 2

          # External DB: no bundled StatefulSet.
          assert_kind_count /tmp/render/helm-extdb.yaml StatefulSet 0

          # External Redis: bundled redis Deployment is gone. Verify by name.
          if awk '/^kind: Deployment$/{f=1; next} /^---$/{f=0} f && /^  name: .*-redis$/' \
               /tmp/render/helm-extredis.yaml | grep -q .; then
            echo "❌ helm-extredis.yaml: bundled redis Deployment is still present"
            fail=1
          else
            echo "✓ helm-extredis.yaml: bundled redis Deployment removed"
          fi

          # Ingress enabled: exactly one Ingress resource.
          assert_kind_count /tmp/render/helm-ingress.yaml Ingress 1

          # Persistence disabled: no PVCs.
          assert_kind_count /tmp/render/helm-nopersist.yaml PersistentVolumeClaim 0

          exit $fail

      - name: kubectl kustomize — render k8s bundles
        run: |
          mkdir -p /tmp/render
          kubectl kustomize deploy/k8s/base \
            > /tmp/render/k8s-base.yaml
          kubectl kustomize deploy/k8s/overlays/external-services \
            > /tmp/render/k8s-external.yaml

          for f in /tmp/render/k8s-*.yaml; do
            test -s "$f" || { echo "❌ empty render: $f"; exit 1; }
          done

      - name: kubectl kustomize — assert overlay shape
        run: |
          fail=0
          # Base bundle ships a postgres StatefulSet; overlay should drop it.
          base_ss=$(grep -cE "^kind: StatefulSet\$" /tmp/render/k8s-base.yaml || true)
          ext_ss=$(grep -cE "^kind: StatefulSet\$" /tmp/render/k8s-external.yaml || true)
          if [ "$base_ss" -lt 1 ]; then
            echo "❌ k8s base bundle is missing the postgres StatefulSet (got $base_ss)"
            fail=1
          fi
          if [ "$ext_ss" != "0" ]; then
            echo "❌ external-services overlay still emits a StatefulSet (got $ext_ss)"
            fail=1
          fi

          # Overlay should drop the bundled redis Deployment too.
          if awk '/^kind: Deployment$/{f=1; next} /^---$/{f=0} f && /^  name: .*-redis$/' \
               /tmp/render/k8s-external.yaml | grep -q .; then
            echo "❌ external-services overlay still emits a redis Deployment"
            fail=1
          fi

          [ "$fail" = 0 ] && echo "✓ external-services overlay drops bundled DB + Redis workloads"
          exit $fail

      - name: kubeconform — validate all rendered manifests
        run: |
          # Validate every render against the targeted Kubernetes version.
          # `-strict` flags duplicate/unknown fields; `-ignore-missing-schemas`
          # only kicks in for CRDs, none of which we ship from these manifests.
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version "${KUBE_VERSION}" \
            -summary \
            /tmp/render/helm-default.yaml \
            /tmp/render/helm-extdb.yaml \
            /tmp/render/helm-extredis.yaml \
            /tmp/render/helm-ingress.yaml \
            /tmp/render/helm-nopersist.yaml \
            /tmp/render/k8s-base.yaml \
            /tmp/render/k8s-external.yaml

      - name: Upload rendered manifests on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-renders
          path: /tmp/render/

  # Aggregator that branch protection points at. Treats "skipped" as a pass so
  # path-filter skips don't block doc-only PRs. Treats "failure" or "cancelled"
  # as a fail.
  ci-complete:
    name: ✅ CI Complete
    runs-on: ubuntu-latest
    needs: [changes, backend-lint, backend-tests, frontend-lint, frontend-tests, e2e-tests, docker-build, security, deploy-validation, deploy-artifacts, prod-stack-smoke]
    if: always()
    steps:
      - name: Check all jobs succeeded or were skipped
        run: |
          ok() {
            # success or skipped both pass; cancelled/failure fails.
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }

          BACKEND_LINT="${{ needs.backend-lint.result }}"
          BACKEND="${{ needs.backend-tests.result }}"
          FRONTEND_LINT="${{ needs.frontend-lint.result }}"
          FRONTEND="${{ needs.frontend-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"
          DOCKER="${{ needs.docker-build.result }}"
          SECURITY="${{ needs.security.result }}"
          DEPLOY="${{ needs.deploy-validation.result }}"
          DEPLOY_ART="${{ needs.deploy-artifacts.result }}"
          PROD_SMOKE="${{ needs.prod-stack-smoke.result }}"

          echo "Backend lint:    $BACKEND_LINT"
          echo "Backend tests:   $BACKEND"
          echo "Frontend lint:   $FRONTEND_LINT"
          echo "Frontend:        $FRONTEND"
          echo "E2E:             $E2E"
          echo "Docker:          $DOCKER"
          echo "Security:        $SECURITY"
          echo "Deploy:          $DEPLOY"
          echo "Deploy artifacts:$DEPLOY_ART"
          echo "Prod smoke:      $PROD_SMOKE"

          fail=0
          for r in "$BACKEND_LINT" "$BACKEND" "$FRONTEND_LINT" "$FRONTEND" "$E2E" "$DOCKER" "$SECURITY" "$DEPLOY" "$DEPLOY_ART" "$PROD_SMOKE"; do
            ok "$r" || fail=1
          done

          if [ $fail -eq 0 ]; then
            echo "✅ All required CI checks passed (or were correctly skipped)"
            exit 0
          else
            echo "❌ One or more required jobs failed or were cancelled"
            exit 1
          fi
