{{- if .Values.nginx.enabled -}}
{{- $component := "nginx" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oms.fullname" . }}-nginx
  labels:
    {{- include "oms.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
    - name: http
      port: {{ .Values.nginx.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "oms.componentSelectorLabels" (merge (dict "component" $component) .) | nindent 4 }}
{{- end }}
