{{- $component := "backend" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "oms.fullname" . }}-backend
  labels:
    {{- include "oms.componentLabels" (merge (dict "component" $component) .) | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "oms.componentSelectorLabels" (merge (dict "component" $component) .) | nindent 4 }}
