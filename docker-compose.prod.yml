version: '3.8'

x-logging: &default-logging
  driver: 'json-file'
  options:
    max-size: '10m'
    max-file: '3'

services:
  db:
    # Digest pinned from `docker pull postgres:18-alpine` on 2026-05-24 (resolved to postgres 18.4).
    # To bump: pull the new tag, copy the Digest line, update the exact version in the tag for readability.
    #
    # PostgreSQL 18+ alpine images changed the on-disk layout to use
    # major-version-specific directory names (see docker-library/postgres#1259).
    # Setting PGDATA to a subdirectory of the mount keeps the existing volume
    # path valid AND gives the image a clean directory it can initialize
    # under the new layout.
    image: postgres:18.4-alpine@sha256:96d56f7f57c6aacd1fcb908bc83b345ec5f83231ee486dd66a1baadce274db88
    logging: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-makerspace_inventory}
      - POSTGRES_USER=${POSTGRES_USER:-makerspace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-makerspace} -d ${POSTGRES_DB:-makerspace_inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis:
    # Digest pinned from `docker pull redis:7-alpine` on 2026-04-21 (resolved to Redis 7.4.8).
    # To bump: pull the new tag, copy the Digest line, update the exact version in the tag for readability.
    image: redis:8.8.0-alpine@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  emqx:
    # Digest pinned from `docker pull emqx/emqx-enterprise:6.2.0` on 2026-04-28.
    # To bump: pull the new tag, copy the Digest line, update the exact version in the tag for readability.
    image: emqx/emqx-enterprise:6.2.0@sha256:da01e1b51c2b60fa735a32922c697bcaa5bcf45c4c76b6ca8214111da752ff25
    container_name: oms-emqx
    logging: *default-logging
    ports:
      - "1883:1883"     # MQTT
      - "8083:8083"     # MQTT-over-WebSocket
      - "8084:8084"     # MQTT-over-WSS
      - "8883:8883"     # MQTTS
      - "18083:18083"   # Dashboard + REST API
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      # bootstrap_users is rendered by deploy.sh from EMQX_DASHBOARD_PASSWORD;
      # EMQX re-applies it on every boot, so the admin login stays in sync with
      # the .env value (oms-f9z).
      - ./scripts/emqx/bootstrap-admins.txt:/opt/emqx/etc/bootstrap_users:ro
    environment:
      - EMQX_NAME=oms-emqx
      - EMQX_HOST=127.0.0.1
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_DASHBOARD_PASSWORD}
      - EMQX_DASHBOARD__BOOTSTRAP_USERS_FILE=/opt/emqx/etc/bootstrap_users
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - app-network

  backend:
    # Canonical builder for the backend image. celery / mqtt_consumer /
    # celery_beat reuse this image via `image: oms-backend:local` rather
    # than each declaring their own `build:` block — that lets a single
    # `docker compose build --no-cache backend` rebuild every backend-
    # derived service at once. Previously each service had its own
    # cached build, so `deploy.sh build --no-cache backend` left the
    # worker containers on a stale image and `forgekey.tasks.<new_task>`
    # raised KeyError in the worker registry (Sentry BACKEND-4, bd
    # oms-8bsc5).
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: oms-backend:local
    logging: *default-logging
    # --max-requests + --max-requests-jitter recycles each worker after ~1000
    # requests so any slow leak (paho buffer growth, sentry buffer, multipart
    # spool retention) is bounded by the recycle window instead of unbounded
    # process lifetime. --graceful-timeout 30 lets in-flight requests finish
    # before SIGKILL on recycle. See docs/INCIDENTS/oom-backend.md (oms-9t2).
    command: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4
      --threads 8
      --worker-class gthread
      --timeout 120
      --max-requests 1000
      --max-requests-jitter 100
      --graceful-timeout 30
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - 8000
    env_file:
      - .env
    environment:
      - DEBUG=0
      # GIT_HASH propagates into Sentry's `release` field so events from
      # Python (backend, celery, mqtt_consumer, celery_beat) get attributed
      # to the same release tag the frontend bundle was built with — that's
      # what powers per-release Session Health, regression detection, and
      # the "first seen in release X" issue grouping.
      - GIT_HASH=${GIT_HASH:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_inventory}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      # Always append `backend,localhost` so EMQX (which fetches JWKS via
      # http://backend:8000/api/forgekey/jwks/ on the docker network) and
      # in-container healthchecks always pass Django ALLOWED_HOSTS even if an
      # operator forgets to include them in .env. Duplicates are harmless.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-oms.example.com,localhost},backend,localhost
      - CSRF_TRUSTED_ORIGINS=https://${DOMAIN:-oms.example.com}
      - CORS_ALLOWED_ORIGINS=https://${DOMAIN:-oms.example.com}
      - FRONTEND_URL=https://${DOMAIN:-oms.example.com}
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - MQTT_BROKER_USERNAME=${MQTT_BROKER_USERNAME:-}
      - MQTT_BROKER_PASSWORD=${MQTT_BROKER_PASSWORD:-}
      - EMQX_API_URL=http://emqx:18083/api/v5
      - EMQX_API_KEY=${EMQX_API_KEY:-}
      - EMQX_API_SECRET=${EMQX_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        # service_started (not service_healthy): backend MQTT connect is lazy
        # (forgekey.tasks.get_mqtt_client) and the EMQX REST API is only used
        # during provisioning. Blocking backend boot on EMQX reaching healthy
        # extends the dependency chain that contributed to oms-801, where the
        # 60s EMQX start_period plus a slow first-healthcheck could push
        # backend startup past the 120s gunicorn worker timeout.
        condition: service_started
    healthcheck:
      # Liveness, not readiness (oms-801): /api/health/livez/ is dep-free and
      # returns 200 if the gunicorn worker is alive. The previous probe hit
      # /api/dashboard/health/ which executes a DB query, so a transient DB
      # hiccup turns the healthcheck red and triggers a container restart even
      # when the process is fine. Readiness is exposed at /api/health/readyz/
      # for callers that do need the dependency check.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/livez/', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network

  celery:
    # Reuse the backend image (see `backend.build` above). depends_on
    # backend so compose creates that container — and runs its build —
    # before this one starts.
    image: oms-backend:local
    logging: *default-logging
    # --max-tasks-per-child mirrors the gunicorn --max-requests recycle so
    # per-task leaks in MQTT publish, image processing, etc. are bounded.
    command: celery -A config worker -l info --max-tasks-per-child=200
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - media_volume:/app/media
      # Named volume for the scheduled `backups.daily_postgres_backup`
      # Celery task. Mounted on `celery` so the worker can write
      # pg_dump archives, and on `backend` (below) so the staff
      # dashboard / `manage.py` commands can inspect what's there.
      - backups_volume:/var/backups/oms
    env_file:
      - .env
    environment:
      - DEBUG=0
      # GIT_HASH propagates into Sentry's `release` field so events from
      # Python (backend, celery, mqtt_consumer, celery_beat) get attributed
      # to the same release tag the frontend bundle was built with — that's
      # what powers per-release Session Health, regression detection, and
      # the "first seen in release X" issue grouping.
      - GIT_HASH=${GIT_HASH:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_inventory}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SKIP_DB_MIGRATIONS=1
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  firmware_builder:
    # Self-hosted firmware build worker. Unlike celery / mqtt_consumer (which
    # reuse oms-backend:local), this carries the git + PlatformIO toolchain via
    # Dockerfile.firmware-builder, and it is the ONLY consumer of the dedicated
    # `builds` queue that forgekey.tasks.build_firmware is routed to. Without
    # it, queued firmware builds sit in Redis forever.
    #
    # Provide a read-only SSH deploy key with read access to the ForgeKey repo
    # via FORGEKEY_DEPLOY_KEY in .env; until it's set the container still runs,
    # but each build fails at `git clone`. See docs/FORGEKEY_FIRMWARE_BUILD.md.
    build:
      context: ./backend
      dockerfile: Dockerfile.firmware-builder
    image: oms-firmware-builder:local
    logging: *default-logging
    # concurrency=1: builds are heavy and serialized. --max-tasks-per-child
    # recycles the worker so a leaky toolchain run can't accumulate.
    command: celery -A config worker -Q builds --concurrency=1 -l info --max-tasks-per-child=20
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    volumes:
      - media_volume:/app/media
      # Read-only SSH deploy key with read access to the ForgeKey repo.
      - ${FORGEKEY_DEPLOY_KEY:-/dev/null}:/root/.ssh/id_ed25519:ro
    env_file:
      - .env
    environment:
      - DEBUG=0
      - GIT_HASH=${GIT_HASH:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_inventory}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SKIP_DB_MIGRATIONS=1
      - FORGEKEY_FIRMWARE_REPO_URL=${FORGEKEY_FIRMWARE_REPO_URL:-git@github.com:uid0/ForgeKey.git}
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Long-running MQTT consumer: subscribes to forgekey/+/status,
  # forgekey/+/+/occupancy, forgekey/+/ota/status, etc. and updates the
  # backing ESP32Device rows (last_seen, is_online, occupancy, firmware
  # ack). Without this service the broker happily delivers messages but
  # nothing in OMS records them — last_seen stalls at the last register/
  # photo-upload time and command ACKs never resolve. (gh forge-2)
  #
  # Run exactly ONE replica per environment. The consumer uses a single
  # paho.Client with the server JWT mint (oms-y5p) to authenticate; two
  # replicas would race on connection state and double-process every
  # message.
  mqtt_consumer:
    # Reuse the backend image (see `backend.build` above).
    image: oms-backend:local
    logging: *default-logging
    command: python manage.py mqtt_consumer
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      - DEBUG=0
      # GIT_HASH propagates into Sentry's `release` field so events from
      # Python (backend, celery, mqtt_consumer, celery_beat) get attributed
      # to the same release tag the frontend bundle was built with — that's
      # what powers per-release Session Health, regression detection, and
      # the "first seen in release X" issue grouping.
      - GIT_HASH=${GIT_HASH:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_inventory}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - SKIP_DB_MIGRATIONS=1
    depends_on:
      backend:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  celery_beat:
    # Single-replica scheduler that fires CELERY_BEAT_SCHEDULE entries
    # (quarterly donor updates, daily vendor compliance digest, daily
    # ForgeKey photo prune, every-30-min stale-device sweep). Run exactly
    # one beat per environment: a second scheduler against the same Redis
    # broker double-fires every periodic task. Scale via
    # `--scale celery=N` if the worker pool needs more throughput, but
    # leave celery_beat at 1 replica.
    #
    # Reuses the backend image (see `backend.build` above).
    image: oms-backend:local
    logging: *default-logging
    # --schedule keeps the shelved last_run_at outside /tmp so a container
    # restart doesn't reset every entry's timer (the 90-day donor task
    # would otherwise never fire on a stack that gets re-deployed weekly).
    # --pidfile under the same persistent path so the lockfile survives
    # the same way.
    command: >-
      celery -A config beat -l info
      --schedule=/app/.beat-state/celerybeat-schedule
      --pidfile=/app/.beat-state/celerybeat.pid
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    volumes:
      - celery_beat_state:/app/.beat-state
    env_file:
      - .env
    environment:
      - DEBUG=0
      # GIT_HASH propagates into Sentry's `release` field so events from
      # Python (backend, celery, mqtt_consumer, celery_beat) get attributed
      # to the same release tag the frontend bundle was built with — that's
      # what powers per-release Session Health, regression detection, and
      # the "first seen in release X" issue grouping.
      - GIT_HASH=${GIT_HASH:-}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_inventory}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      # Beat doesn't run migrations — celery worker / backend already do —
      # but it does need to import the same Django settings to load
      # CELERY_BEAT_SCHEDULE.
      - SKIP_DB_MIGRATIONS=1
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      celery:
        # Beat only enqueues messages; it doesn't need the worker to be
        # healthy to start. Wait for celery to be `service_started` so
        # `docker compose up -d` brings them up in a sensible order, but
        # don't gate on health — that would couple beat restarts to
        # worker restarts unnecessarily.
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=/api
        - VITE_GIT_HASH=${GIT_HASH}
        - VITE_GITHUB_URL=${GITHUB_URL:-https://github.com/uid0/openmakersuite}
        # Sentry DSN must reach the build step (vite inlines VITE_* at
        # bundling). Without this `Sentry.init` silently no-ops in prod
        # because import.meta.env.VITE_SENTRY_DSN is undefined.
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    logging: *default-logging
    volumes:
      - frontend_build:/app/frontend
    healthcheck:
      test: ["CMD", "test", "-f", "/app/frontend/index.html"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *default-logging
    command: celery -A config flower --port=5555 --broker=redis://redis:6379/0 --broker_api=redis://redis:6379/0
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-makerspace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-makerspace_inventory}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    networks:
      - app-network


  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - frontend_build:/app/frontend:ro
      - letsencrypt_certs:/etc/letsencrypt
      - letsencrypt_lib:/var/lib/letsencrypt
      - letsencrypt_logs:/var/log/letsencrypt
      - certbot_challenges:/var/www/certbot
    environment:
      - DOMAIN=${DOMAIN:-oms.example.com}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-}
      - LETSENCRYPT_DOMAINS=${LETSENCRYPT_DOMAINS:-oms.example.com}
      # CSP connect-src whitelist for the self-hosted Sentry host.
      # Browser blocks every Sentry SDK POST (errors + replays + envelope)
      # unless the DSN host is in connect-src; this defaults to the
      # production highlighter host but can be overridden via .env for
      # staging / a future migration to a different Sentry domain.
      - SENTRY_HOST=${SENTRY_HOST:-highlighter.openmakersuite.net}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
  static_volume:
  media_volume:
  frontend_build:
  letsencrypt_certs:
  letsencrypt_lib:
  letsencrypt_logs:
  certbot_challenges:
  emqx_data:
  emqx_log:
  celery_beat_state:
  # Daily Postgres backups land here, written by the `celery` worker
  # (`backups.daily_postgres_backup`). Retention is enforced inside
  # the task itself (OMS_BACKUP_RETENTION_DAYS, default 14 days), so
  # the volume size scales with that constant times the DB size.
  backups_volume:

networks:
  app-network:
    driver: bridge
