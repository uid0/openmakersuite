name: 🚀 Automated Release & Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

# Allow manual triggering for testing
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

# Releases must complete — never cancel an in-progress release run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write  # Required for signing

jobs:
  check-prerequisites:
    name: 🔍 Check Prerequisites
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      last_release: ${{ steps.check.outputs.last_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if release needed
        id: check
        run: |
          # Get the last release
          LAST_RELEASE=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "v0.0.0"')
          echo "last_release=$LAST_RELEASE" >> $GITHUB_OUTPUT

          # Check if there are new commits since last release
          if [ "$LAST_RELEASE" = "v0.0.0" ]; then
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "🆕 No previous releases found, will create first release"
          else
            NEW_COMMITS=$(git rev-list ${LAST_RELEASE}..HEAD --count)
            if [ $NEW_COMMITS -gt 0 ]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "📈 Found $NEW_COMMITS new commits since $LAST_RELEASE"
            else
              echo "should_release=false" >> $GITHUB_OUTPUT
              echo "✅ No new commits since $LAST_RELEASE"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  generate-version:
    name: 📋 Generate Version
    runs-on: ubuntu-latest
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.should_release == 'true'
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      new_tag: ${{ steps.version.outputs.new_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate new version
        id: version
        run: |
          LAST_RELEASE="${{ needs.check-prerequisites.outputs.last_release }}"

          # Parse current version (remove 'v' prefix)
          if [ "$LAST_RELEASE" = "v0.0.0" ]; then
            CURRENT_VERSION="0.0.0"
          else
            CURRENT_VERSION=${LAST_RELEASE#v}
          fi

          echo "Current version: $CURRENT_VERSION"

          # Split version into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Determine release type
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          else
            # Auto-detect based on commit messages
            COMMITS=$(git log ${LAST_RELEASE}..HEAD --pretty=format:"%s" || git log --pretty=format:"%s")
            if echo "$COMMITS" | grep -i "breaking\|major" > /dev/null; then
              RELEASE_TYPE="major"
            elif echo "$COMMITS" | grep -i "feat\|feature\|minor" > /dev/null; then
              RELEASE_TYPE="minor"
            else
              RELEASE_TYPE="patch"
            fi
          fi

          echo "Release type: $RELEASE_TYPE"

          # Increment version
          case $RELEASE_TYPE in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "🏷️ New version will be: $NEW_TAG"

      - name: Generate changelog
        id: changelog
        run: |
          LAST_RELEASE="${{ needs.check-prerequisites.outputs.last_release }}"
          NEW_TAG="${{ steps.version.outputs.new_tag }}"

          echo "## 🚀 Release $NEW_TAG" > changelog.md
          echo "" >> changelog.md
          echo "### 📝 Changes" >> changelog.md

          if [ "$LAST_RELEASE" = "v0.0.0" ]; then
            echo "- 🎉 Initial release" >> changelog.md
            echo "- ✨ Full makerspace inventory management system" >> changelog.md
          else
            # Generate changelog from commits
            git log ${LAST_RELEASE}..HEAD --pretty=format:"- %s" --no-merges >> changelog.md || echo "- 🎉 Initial release" >> changelog.md
          fi

          echo "" >> changelog.md
          echo "### 🔧 Technical Details" >> changelog.md
          echo "- **Backend Coverage**: $(grep -o 'Total coverage: [0-9.]*%' backend/htmlcov/index.html 2>/dev/null || echo 'N/A')" >> changelog.md
          echo "- **Frontend Coverage**: Available in CI reports" >> changelog.md
          echo "- **Security**: All Bandit and Safety checks passed" >> changelog.md
          echo "- **Tests**: All backend and frontend tests passing" >> changelog.md

          # Read changelog content for output
          CHANGELOG_CONTENT=$(cat changelog.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG_CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-artifacts:
    name: 🏗️ Build Release Artifacts
    runs-on: ubuntu-latest
    needs: [check-prerequisites, generate-version]
    if: needs.check-prerequisites.outputs.should_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          NEW_TAG="${{ needs.generate-version.outputs.new_tag }}"
          REPO_NAME="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          # Build backend image
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/$REPO_LOWER/backend:$NEW_TAG \
            --tag ghcr.io/$REPO_LOWER/backend:latest \
            --push \
            --file backend/Dockerfile \
            backend/

          # Build frontend image
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/$REPO_LOWER/frontend:$NEW_TAG \
            --tag ghcr.io/$REPO_LOWER/frontend:latest \
            --push \
            --file frontend/Dockerfile \
            frontend/

      - name: Install syft for SBOM generation
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Generate Software Bill of Materials
        run: |
          NEW_TAG="${{ needs.generate-version.outputs.new_tag }}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          # Per-component CycloneDX SBOMs. Three scopes:
          #   1. backend source — picks up python deps from requirements*.txt
          #   2. frontend source — picks up node deps from package-lock.json
          #   3. each published container image — captures the full OS+runtime
          #      surface (e.g. alpine packages, system libs) that the source
          #      SBOMs can't see.
          # We standardize on CycloneDX 1.5 JSON because both Dependency-Track
          # and GitHub's dependency graph ingest it natively. SPDX is left
          # for a follow-up if a consumer asks for it.

          syft scan dir:backend  -o cyclonedx-json="openmakersuite-$NEW_TAG-sbom-backend-source.cdx.json"
          syft scan dir:frontend -o cyclonedx-json="openmakersuite-$NEW_TAG-sbom-frontend-source.cdx.json"
          syft scan "ghcr.io/$REPO_LOWER/backend:$NEW_TAG"  -o cyclonedx-json="openmakersuite-$NEW_TAG-sbom-backend-image.cdx.json"
          syft scan "ghcr.io/$REPO_LOWER/frontend:$NEW_TAG" -o cyclonedx-json="openmakersuite-$NEW_TAG-sbom-frontend-image.cdx.json"

          echo "📋 SBOMs generated:"
          ls -lh openmakersuite-$NEW_TAG-sbom-*.cdx.json

      - name: Create release bundle
        run: |
          NEW_TAG="${{ needs.generate-version.outputs.new_tag }}"

          # Create release directory
          mkdir -p release-bundle

          # Copy deployment files
          cp docker-compose.yml release-bundle/
          cp -r .env.example release-bundle/

          # Create deployment script
          cat > release-bundle/deploy.sh << 'EOF'
          #!/bin/bash
          set -e

          echo "🚀 Deploying OpenMakerSuite ${{ needs.generate-version.outputs.new_tag }}"

          # Check for required files
          if [ ! -f .env ]; then
            echo "⚠️  Creating .env from example..."
            cp .env.example .env
            echo "📝 Please edit .env with your configuration"
          fi

          # Pull and start services
          docker compose pull
          docker compose up -d

          echo "✅ Deployment complete!"
          echo "🌐 Frontend: http://localhost:3000"
          echo "🔧 Backend: http://localhost:8000"
          echo "👨‍💼 Admin: http://localhost:8000/admin"
          EOF

          chmod +x release-bundle/deploy.sh

          # Create documentation
          cat > release-bundle/README.md << EOF
          # OpenMakerSuite Release ${{ needs.generate-version.outputs.new_tag }}

          This release bundle contains everything needed to deploy OpenMakerSuite.

          ## Quick Start

          1. Extract this bundle
          2. Copy \`.env.example\` to \`.env\` and configure
          3. Run: \`./deploy.sh\`

          ## What's Included

          - \`docker-compose.yml\` - Container orchestration
          - \`deploy.sh\` - Automated deployment script
          - \`.env.example\` - Environment configuration template

          ## Container Images

          - Backend: \`ghcr.io/${{ github.repository }}/backend:${{ needs.generate-version.outputs.new_tag }}\`
          - Frontend: \`ghcr.io/${{ github.repository }}/frontend:${{ needs.generate-version.outputs.new_tag }}\`

          ## Software Bill of Materials

          Per-component CycloneDX SBOMs are attached to the GitHub Release:

          - \`*-sbom-backend-source.cdx.json\` — Python deps from backend source
          - \`*-sbom-frontend-source.cdx.json\` — Node deps from frontend source
          - \`*-sbom-backend-image.cdx.json\` — backend container (incl. OS packages)
          - \`*-sbom-frontend-image.cdx.json\` — frontend container (incl. OS packages)

          Each SBOM ships with a Sigstore \`.sig\` + \`.pem\` so consumers can
          verify provenance with \`cosign verify-blob\` against the same identity
          that signed the release bundle.

          EOF

          # Create tarball
          tar -czf openmakersuite-$NEW_TAG.tar.gz -C release-bundle .

          # Generate checksums
          sha256sum openmakersuite-$NEW_TAG.tar.gz > openmakersuite-$NEW_TAG.tar.gz.sha256

          echo "📦 Release bundle created: openmakersuite-$NEW_TAG.tar.gz"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            openmakersuite-*.tar.gz
            openmakersuite-*.tar.gz.sha256
            openmakersuite-*-sbom-*.cdx.json

  sign-and-release:
    name: 🔐 Sign & Create Release
    runs-on: ubuntu-latest
    needs: [check-prerequisites, generate-version, build-artifacts]
    if: needs.check-prerequisites.outputs.should_release == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Sign release artifacts
        run: |
          NEW_TAG="${{ needs.generate-version.outputs.new_tag }}"

          # Sign the release bundle with keyless signing (Sigstore).
          # --yes auto-confirms the Sigstore transparency-log ToS prompt
          # that cosign v2 added; without it CI fails with
          # "upload to tlog: user declined the prompt" on every run.
          cosign sign-blob \
            --yes \
            --output-signature openmakersuite-$NEW_TAG.tar.gz.sig \
            --output-certificate openmakersuite-$NEW_TAG.tar.gz.pem \
            openmakersuite-$NEW_TAG.tar.gz

          # Sign each SBOM the same way so downstream consumers can
          # verify provenance without trusting the GitHub Releases
          # download path. Loop in a stable order so the .sig/.pem
          # names match the SBOM file they cover.
          # nullglob protects against the empty case (the build-artifacts
          # job is supposed to produce them, but a failed syft step
          # shouldn't make this loop iterate over the literal glob).
          shopt -s nullglob
          for sbom in "openmakersuite-$NEW_TAG"-sbom-*.cdx.json; do
            cosign sign-blob \
              --yes \
              --output-signature "${sbom}.sig" \
              --output-certificate "${sbom}.pem" \
              "$sbom"
          done

          echo "🔐 Artifacts signed successfully"
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Create GitHub Release
        id: create_release
        env:
          # Pipe new_tag + changelog through env vars, NOT direct
          # ${{ ... }} interpolation. Actions substitutes ${{ ... }}
          # into the script verbatim BEFORE bash parses it, so a
          # changelog value containing literal parens (e.g.
          # "Fix(#143): ... (#144)") blows up with
          # "syntax error near unexpected token '('".
          # Going through env makes the value a runtime string that
          # bash never tries to parse as code.
          NEW_TAG: ${{ needs.generate-version.outputs.new_tag }}
          CHANGELOG: ${{ needs.generate-version.outputs.changelog }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write the changelog to a file so any embedded quotes,
          # backticks, or shell metacharacters never reach the
          # command line at all.
          printf '%s' "$CHANGELOG" > release-notes.md

          # Collect every artifact under one glob so the gh CLI gets a
          # stable, ordered list. SBOMs (per-component CycloneDX) +
          # their cosign sig/pem ride alongside the release tarball.
          shopt -s nullglob
          ARTIFACTS=(
            "openmakersuite-$NEW_TAG.tar.gz"
            "openmakersuite-$NEW_TAG.tar.gz.sha256"
            "openmakersuite-$NEW_TAG.tar.gz.sig"
            "openmakersuite-$NEW_TAG.tar.gz.pem"
            openmakersuite-$NEW_TAG-sbom-*.cdx.json
            openmakersuite-$NEW_TAG-sbom-*.cdx.json.sig
            openmakersuite-$NEW_TAG-sbom-*.cdx.json.pem
          )

          gh release create "$NEW_TAG" \
            --title "🚀 Release $NEW_TAG" \
            --notes-file release-notes.md \
            --latest \
            "${ARTIFACTS[@]}"

          echo "✅ GitHub release created: $NEW_TAG"
          echo "release_url=$(gh release view "$NEW_TAG" --json url --jq .url)" >> "$GITHUB_OUTPUT"

  notify-success:
    name: 🎉 Notification
    runs-on: ubuntu-latest
    needs: [check-prerequisites, generate-version, sign-and-release]
    if: needs.check-prerequisites.outputs.should_release == 'true'
    steps:
      - name: Send success notification
        run: |
          NEW_TAG="${{ needs.generate-version.outputs.new_tag }}"
          RELEASE_URL="${{ needs.sign-and-release.outputs.release_url }}"

          echo "🎉 SUCCESS: Release $NEW_TAG has been created and published!"
          echo "📦 Release URL: $RELEASE_URL"
          echo "🔐 Cryptographically signed with Sigstore"

          # If Slack webhook is configured, send notification
          if [ ! -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚀 *OpenMakerSuite $NEW_TAG Released!*\n📦 <$RELEASE_URL|Download Release>\n🔐 Cryptographically signed\"}" \
              "${{ secrets.SLACK_WEBHOOK_URL }}"
          fi
