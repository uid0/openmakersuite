name: 🐳 Build and Publish Docker Containers
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    branches:
      - main
      - "**" # All branches for issue-NN-latest tagging
    tags:
      - "v*" # Version tags
  pull_request:
    branches: [main]

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  determine-tags:
    name: 🏷️ Determine Tags
    runs-on: ubuntu-latest
    # Only run if CI succeeded (for workflow_run) or on direct push/tag
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'push' && github.ref_type == 'branch')
    outputs:
      backend_tags: ${{ steps.tags.outputs.backend_tags }}
      frontend_tags: ${{ steps.tags.outputs.frontend_tags }}
      should_build: ${{ steps.tags.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tags
        id: tags
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/$REPO_LOWER"

          BACKEND_TAGS=""
          FRONTEND_TAGS=""
          SHOULD_BUILD="true"

          # Check if this is a tag push
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            VERSION_TAG="${{ github.ref_name }}"
            echo "🏷️ Git tag detected: $VERSION_TAG"

            BACKEND_TAGS="$REGISTRY/backend:$VERSION_TAG,$REGISTRY/backend:latest"
            FRONTEND_TAGS="$REGISTRY/frontend:$VERSION_TAG,$REGISTRY/frontend:latest"

          # Check if this is main branch
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "🏷️ Main branch detected - tagging as latest"
            BACKEND_TAGS="$REGISTRY/backend:latest"
            FRONTEND_TAGS="$REGISTRY/frontend:latest"

          # Check if this is a feature branch (extract issue number after slash)
          elif [[ "${{ github.ref }}" =~ ^refs/heads/.*/([0-9]+)- ]]; then
            ISSUE_NUM=$(echo "${{ github.ref }}" | sed -n 's|.*/\([0-9]*\)-.*|\1|p')
            if [ -n "$ISSUE_NUM" ]; then
              ISSUE_TAG="issue-$ISSUE_NUM-latest"
              echo "🏷️ Feature branch detected - tagging as $ISSUE_TAG (extracted issue #$ISSUE_NUM)"
              BACKEND_TAGS="$REGISTRY/backend:$ISSUE_TAG"
              FRONTEND_TAGS="$REGISTRY/frontend:$ISSUE_TAG"
            else
              echo "⚠️ Could not extract issue number from branch, skipping build"
              SHOULD_BUILD="false"
            fi

          # For workflow_run events, check the branch that triggered CI
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Get the branch from the workflow run
            BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
            if [[ "$BRANCH_NAME" == "main" ]]; then
              echo "🏷️ CI completed on main branch - tagging as latest"
              BACKEND_TAGS="$REGISTRY/backend:latest"
              FRONTEND_TAGS="$REGISTRY/frontend:latest"
            elif [[ "$BRANCH_NAME" =~ .*/([0-9]+)- ]]; then
              ISSUE_NUM=$(echo "$BRANCH_NAME" | sed -n 's|.*/\([0-9]*\)-.*|\1|p')
              if [ -n "$ISSUE_NUM" ]; then
                ISSUE_TAG="issue-$ISSUE_NUM-latest"
                echo "🏷️ CI completed on feature branch - tagging as $ISSUE_TAG (extracted issue #$ISSUE_NUM)"
                BACKEND_TAGS="$REGISTRY/backend:$ISSUE_TAG"
                FRONTEND_TAGS="$REGISTRY/frontend:$ISSUE_TAG"
              else
                echo "⚠️ Could not extract issue number from branch, skipping build"
                SHOULD_BUILD="false"
              fi
            else
              echo "⚠️ Branch name doesn't match expected pattern, skipping build"
              SHOULD_BUILD="false"
            fi
          else
            echo "⚠️ Unhandled event type or branch, skipping build"
            SHOULD_BUILD="false"
          fi

          echo "📦 Backend tags: $BACKEND_TAGS"
          echo "📦 Frontend tags: $FRONTEND_TAGS"
          echo "🔨 Should build: $SHOULD_BUILD"

          echo "backend_tags=$BACKEND_TAGS" >> $GITHUB_OUTPUT
          echo "frontend_tags=$FRONTEND_TAGS" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

  build-backend:
    name: 🏗️ Build Backend Container
    runs-on: ubuntu-latest
    needs: determine-tags
    if: needs.determine-tags.outputs.should_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=${{ needs.determine-tags.outputs.backend_tags }},enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.determine-tags.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: 🏗️ Build Frontend Container
    runs-on: ubuntu-latest
    needs: determine-tags
    if: needs.determine-tags.outputs.should_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for git hash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git hash
        id: git
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT
          echo "🔍 Git hash: $GIT_HASH"

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.determine-tags.outputs.frontend_tags }}
          build-args: |
            REACT_APP_API_URL=/api
            REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}
            REACT_APP_SENTRY_ENVIRONMENT=production
            REACT_APP_GIT_HASH=${{ steps.git.outputs.hash }}
            REACT_APP_GITHUB_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-complete:
    name: ✅ Build Complete
    runs-on: ubuntu-latest
    needs: [determine-tags, build-backend, build-frontend]
    if: always() && needs.determine-tags.outputs.should_build == 'true'
    steps:
      - name: Report completion
        run: |
          if [[ "${{ needs.build-backend.result }}" == "success" && "${{ needs.build-frontend.result }}" == "success" ]]; then
            echo "✅ All containers built and published successfully!"
            echo "📦 Backend tags: ${{ needs.determine-tags.outputs.backend_tags }}"
            echo "📦 Frontend tags: ${{ needs.determine-tags.outputs.frontend_tags }}"
          else
            echo "❌ Some builds failed:"
            echo "  Backend: ${{ needs.build-backend.result }}"
            echo "  Frontend: ${{ needs.build-frontend.result }}"
            exit 1
          fi
