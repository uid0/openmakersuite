name: 🧪 Test Release Automation

# This workflow tests the release automation system
# Run manually to verify everything is configured correctly

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (no actual release)'
        required: true
        default: true
        type: boolean
      test_signing:
        description: 'Test cryptographic signing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: read
  id-token: write  # Required for signing

jobs:
  test-prerequisites:
    name: 🔍 Test Prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test GitHub CLI access
        run: |
          if gh --version; then
            echo "✅ GitHub CLI is available"
          else
            echo "❌ GitHub CLI not available"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test repository access
        run: |
          REPO_INFO=$(gh repo view --json name,owner)
          echo "✅ Repository access confirmed"
          echo "Repository: $(echo $REPO_INFO | jq -r '.owner.login + "/" + .name')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test version generation logic
        run: |
          # Test semantic version parsing
          CURRENT_VERSION="1.2.3"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          # Test patch increment
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "✅ Version logic test: $CURRENT_VERSION → $NEW_VERSION"

          if [ "$NEW_VERSION" = "1.2.4" ]; then
            echo "✅ Version increment logic works correctly"
          else
            echo "❌ Version increment logic failed"
            exit 1
          fi

  test-docker-build:
    name: 🐳 Test Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Test backend build
        run: |
          echo "🏗️ Testing backend Docker build..."
          docker buildx build \
            --platform linux/amd64 \
            --tag test-backend:latest \
            --file backend/Dockerfile \
            backend/
          echo "✅ Backend build successful"

      - name: Test frontend build
        run: |
          echo "🏗️ Testing frontend Docker build..."
          docker buildx build \
            --platform linux/amd64 \
            --tag test-frontend:latest \
            --file frontend/Dockerfile \
            frontend/
          echo "✅ Frontend build successful"

  test-signing:
    name: 🔐 Test Cryptographic Signing
    runs-on: ubuntu-latest
    if: github.event.inputs.test_signing == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Create test file
        run: |
          echo "This is a test file for signing" > test-file.txt
          sha256sum test-file.txt > test-file.txt.sha256

      - name: Test signing
        run: |
          echo "🔐 Testing cryptographic signing..."

          # Sign the test file. --yes auto-confirms the Sigstore
          # transparency-log ToS prompt cosign v2 added; without it
          # CI fails with "upload to tlog: user declined the prompt".
          cosign sign-blob \
            --yes \
            --output-signature test-file.txt.sig \
            --output-certificate test-file.txt.pem \
            test-file.txt

          echo "✅ Signing completed"
        env:
          COSIGN_EXPERIMENTAL: 1

      - name: Test signature verification
        run: |
          echo "🔍 Testing signature verification..."

          # Verify the signature
          cosign verify-blob \
            --certificate test-file.txt.pem \
            --signature test-file.txt.sig \
            test-file.txt

          echo "✅ Signature verification successful"
        env:
          COSIGN_EXPERIMENTAL: 1

  test-changelog-generation:
    name: 📝 Test Changelog Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test changelog generation
        run: |
          echo "📝 Testing changelog generation..."

          # Generate a test changelog
          echo "## 🚀 Release v1.0.0-test" > test-changelog.md
          echo "" >> test-changelog.md
          echo "### 📝 Changes" >> test-changelog.md

          # Get recent commits (last 5)
          git log --oneline -5 --pretty=format:"- %s" >> test-changelog.md || echo "- 🎉 Test release" >> test-changelog.md

          echo "" >> test-changelog.md
          echo "### 🔧 Technical Details" >> test-changelog.md
          echo "- **Tests**: All passing" >> test-changelog.md
          echo "- **Security**: All checks passed" >> test-changelog.md

          echo "✅ Changelog generated:"
          echo "========================"
          cat test-changelog.md
          echo "========================"

  test-summary:
    name: 📋 Test Summary
    runs-on: ubuntu-latest
    needs: [test-prerequisites, test-docker-build, test-signing, test-changelog-generation]
    if: always()
    steps:
      - name: Generate test report
        run: |
          echo "🧪 Release Automation Test Results"
          echo "=================================="
          echo ""

          # Check job results
          echo "Job Results:"
          echo "- Prerequisites: ${{ needs.test-prerequisites.result }}"
          echo "- Docker Build: ${{ needs.test-docker-build.result }}"
          echo "- Signing: ${{ needs.test-signing.result }}"
          echo "- Changelog: ${{ needs.test-changelog-generation.result }}"
          echo ""

          # Overall status
          if [[ "${{ needs.test-prerequisites.result }}" == "success" && \
                "${{ needs.test-docker-build.result }}" == "success" && \
                ("${{ needs.test-signing.result }}" == "success" || "${{ needs.test-signing.result }}" == "skipped") && \
                "${{ needs.test-changelog-generation.result }}" == "success" ]]; then
            echo "✅ All tests passed! Release automation is ready."
            echo ""
            echo "Next steps:"
            echo "1. 🚀 Push commits to main branch to trigger automatic releases"
            echo "2. 📖 Read RELEASE_AUTOMATION.md for full documentation"
          else
            echo "❌ Some tests failed. Please review the job outputs above."
            echo ""
            echo "Common fixes:"
            echo "- Run './scripts/setup-release-automation.sh' to configure secrets"
            echo "- Check Docker builds are working correctly"
            echo "- Verify repository permissions"
            exit 1
          fi
