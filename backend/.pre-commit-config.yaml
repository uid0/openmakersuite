# Pre-commit hooks for code quality and consistency
# See https://pre-commit.com for more information

repos:
  # General file cleanups
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: migrations/
      - id: end-of-file-fixer
        exclude: migrations/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending

  # black, isort and flake8 through scripts/ci-lint.sh, the script CI's Backend
  # Lint job calls, exactly as the root .pre-commit-config.yaml runs them (see
  # the comment there). The mirror hooks these replace pinned black 24.1.1
  # (rewriting, not checking), isort 5.13.2 and flake8 7.0.0, none of which is
  # what CI runs. pre-commit runs hooks from the repo root even with
  # `-c backend/.pre-commit-config.yaml`, so the entry and patterns are
  # root-relative. The shared input pattern covers the backend working tree,
  # the shared script, and configuration that changes its result.
  - repo: local
    hooks:
      - id: black
        name: black (scripts/ci-lint.sh)
        entry: scripts/ci-lint.sh black
        language: system
        files: &backend_lint_inputs ^(backend/|scripts/ci-lint\.sh$|\.gitignore$)
        pass_filenames: false
      - id: isort
        name: isort (scripts/ci-lint.sh)
        entry: scripts/ci-lint.sh isort
        language: system
        files: *backend_lint_inputs
        pass_filenames: false
      - id: flake8
        name: flake8 (scripts/ci-lint.sh)
        entry: scripts/ci-lint.sh flake8
        language: system
        files: *backend_lint_inputs
        pass_filenames: false

  # Security checks
  # Same bandit version, scope and skips as the root .pre-commit-config.yaml
  # hook and CI (see the comments there). pre-commit runs hooks from the repo
  # root even with `-c backend/.pre-commit-config.yaml`, so paths are
  # root-relative. pass_filenames is off because bandit's argparse takes its
  # targets as one positional group: filenames appended after `-r <dir> -s ...`
  # are rejected as "unrecognized arguments".
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^backend/
        exclude: ^(backend/.*migrations/|backend/.*tests.*)
        pass_filenames: false
        args:
          [
            "-r",
            "-s",
            "B101,B105,B106,B308",
            "-x",
            "*/tests/*,*/migrations/*",
            "backend",
          ]

  # Django-specific checks
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.16.0
    hooks:
      - id: django-upgrade
        args: ["--target-version", "4.2"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
