name: 🐳 Build and Publish Docker Containers
# Image and chart publishing is strictly gated on a successful CI run.
# We only trigger off `workflow_run` (CI completed) and require
# `conclusion == 'success'`. There is no `push` / `pull_request` trigger here:
# adding one would re-introduce a path where containers/charts can be published
# even though CI failed (linting, unit tests, coverage, frontend build, Docker
# build, security, manifest validation, Helm lint, or template rendering).
# See AC-11 (oms-2gi).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: docker-build-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  determine-tags:
    name: 🏷️ Determine Tags
    runs-on: ubuntu-latest
    # AC-11 release gate: only run when CI fully succeeded. Any other
    # workflow_run conclusion (failure, cancelled, timed_out, action_required,
    # neutral, skipped, stale) skips the entire publish chain.
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      backend_tags: ${{ steps.tags.outputs.backend_tags }}
      frontend_tags: ${{ steps.tags.outputs.frontend_tags }}
      should_build: ${{ steps.tags.outputs.should_build }}
      publish_helm: ${{ steps.tags.outputs.publish_helm }}
      sha_short: ${{ steps.tags.outputs.sha_short }}
      git_tag: ${{ steps.tags.outputs.git_tag }}
      head_branch: ${{ steps.tags.outputs.head_branch }}
      head_sha: ${{ steps.tags.outputs.head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Build the exact SHA CI verified, not the workflow file's HEAD.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Determine tags
        id: tags
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          REGISTRY="ghcr.io/$REPO_LOWER"

          BACKEND_TAGS=""
          FRONTEND_TAGS=""
          SHOULD_BUILD="true"
          PUBLISH_HELM="false"

          # All triggers come from a successful CI workflow_run. Use the SHA
          # CI verified — not github.sha, which points at the workflow file commit.
          BUILD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHA_SHORT="${BUILD_SHA:0:7}"
          BRANCH_NAME="${{ github.event.workflow_run.head_branch }}"
          echo "🔍 Build SHA: $BUILD_SHA (short: $SHA_SHORT)"
          echo "🔍 Branch:    $BRANCH_NAME"

          # Detect a version tag pointing at the verified SHA. This covers
          # tag pushes (vX.Y.Z) that triggered CI on the tagged commit.
          GIT_TAG=$(git tag --points-at "$BUILD_SHA" 2>/dev/null | grep -E '^v' | head -1 || true)

          if [ -n "$GIT_TAG" ]; then
            echo "🏷️ Version tag detected: $GIT_TAG"
            BACKEND_TAGS="$REGISTRY/backend:$GIT_TAG,$REGISTRY/backend:latest,$REGISTRY/backend:sha-$SHA_SHORT"
            FRONTEND_TAGS="$REGISTRY/frontend:$GIT_TAG,$REGISTRY/frontend:latest,$REGISTRY/frontend:sha-$SHA_SHORT"
            PUBLISH_HELM="true"

          elif [[ "$BRANCH_NAME" == "main" ]]; then
            echo "🏷️ Main branch — tagging as latest + main + sha-$SHA_SHORT"
            BACKEND_TAGS="$REGISTRY/backend:latest,$REGISTRY/backend:main,$REGISTRY/backend:sha-$SHA_SHORT"
            FRONTEND_TAGS="$REGISTRY/frontend:latest,$REGISTRY/frontend:main,$REGISTRY/frontend:sha-$SHA_SHORT"
            PUBLISH_HELM="true"

          elif [[ "$BRANCH_NAME" =~ .*/([0-9]+)- ]]; then
            ISSUE_NUM=$(echo "$BRANCH_NAME" | sed -n 's|.*/\([0-9]*\)-.*|\1|p')
            if [ -n "$ISSUE_NUM" ]; then
              ISSUE_TAG="issue-$ISSUE_NUM-latest"
              echo "🏷️ Feature branch — tagging as $ISSUE_TAG (issue #$ISSUE_NUM)"
              BACKEND_TAGS="$REGISTRY/backend:$ISSUE_TAG"
              FRONTEND_TAGS="$REGISTRY/frontend:$ISSUE_TAG"
            else
              echo "⚠️ Could not extract issue number from branch, skipping build"
              SHOULD_BUILD="false"
            fi
          else
            echo "⚠️ Branch name doesn't match expected pattern, skipping build"
            SHOULD_BUILD="false"
          fi

          echo "📦 Backend tags: $BACKEND_TAGS"
          echo "📦 Frontend tags: $FRONTEND_TAGS"
          echo "🔨 Should build: $SHOULD_BUILD"
          echo "📜 Publish Helm: $PUBLISH_HELM"

          echo "backend_tags=$BACKEND_TAGS" >> $GITHUB_OUTPUT
          echo "frontend_tags=$FRONTEND_TAGS" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "publish_helm=$PUBLISH_HELM" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "git_tag=$GIT_TAG" >> $GITHUB_OUTPUT
          echo "head_branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "head_sha=$BUILD_SHA" >> $GITHUB_OUTPUT

  build-backend:
    name: 🏗️ Build Backend Container
    runs-on: ubuntu-latest
    needs: determine-tags
    if: needs.determine-tags.outputs.should_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-tags.outputs.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=${{ needs.determine-tags.outputs.backend_tags }},enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.determine-tags.outputs.backend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: 🏗️ Build Frontend Container
    runs-on: ubuntu-latest
    needs: determine-tags
    if: needs.determine-tags.outputs.should_build == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-tags.outputs.head_sha }}
          fetch-depth: 0 # Need full history for git hash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get git hash
        id: git
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT
          echo "🔍 Git hash: $GIT_HASH"

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.determine-tags.outputs.frontend_tags }}
          build-args: |
            REACT_APP_API_URL=/api
            REACT_APP_SENTRY_DSN=${{ secrets.REACT_APP_SENTRY_DSN }}
            REACT_APP_SENTRY_ENVIRONMENT=production
            REACT_APP_GIT_HASH=${{ steps.git.outputs.hash }}
            REACT_APP_GITHUB_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  upload-sourcemaps:
    name: 📤 Upload Frontend Source Maps to Sentry
    runs-on: ubuntu-latest
    needs: [determine-tags, build-frontend]
    if: |
      needs.determine-tags.outputs.should_build == 'true' &&
      needs.determine-tags.outputs.head_branch == 'main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-tags.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Get git hash
        id: git
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "hash=$GIT_HASH" >> $GITHUB_OUTPUT
          echo "🔍 Git hash: $GIT_HASH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (with source maps)
        working-directory: frontend
        env:
          REACT_APP_API_URL: /api
          REACT_APP_SENTRY_DSN: ${{ secrets.REACT_APP_SENTRY_DSN }}
          REACT_APP_SENTRY_ENVIRONMENT: production
          REACT_APP_GIT_HASH: ${{ steps.git.outputs.hash }}
          REACT_APP_GITHUB_URL: https://github.com/${{ github.repository }}
          GENERATE_SOURCEMAP: "true"
        run: npm run build

      - name: Upload source maps to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          GIT_HASH: ${{ steps.git.outputs.hash }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "⚠️  Sentry secrets not configured (SENTRY_AUTH_TOKEN / SENTRY_ORG / SENTRY_PROJECT) — skipping source map upload."
            exit 0
          fi
          npm install -g @sentry/cli
          sentry-cli releases new "$GIT_HASH"
          sentry-cli releases files "$GIT_HASH" upload-sourcemaps ./frontend/build/static/js --url-prefix '~/static/js' --rewrite
          sentry-cli releases finalize "$GIT_HASH"
          echo "✅ Source maps uploaded for release $GIT_HASH"

  publish-helm:
    name: 📜 Publish Helm Chart
    runs-on: ubuntu-latest
    needs: [determine-tags, build-backend, build-frontend]
    if: |
      needs.determine-tags.outputs.should_build == 'true' &&
      needs.determine-tags.outputs.publish_helm == 'true' &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.determine-tags.outputs.head_sha }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Log in to GHCR for Helm OCI
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Resolve chart channel + version
        id: chart
        env:
          SHA_SHORT: ${{ needs.determine-tags.outputs.sha_short }}
          GIT_TAG: ${{ needs.determine-tags.outputs.git_tag }}
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
          CHART_DIR="deploy/helm/openmakersuite"
          CHART_NAME=$(grep -E '^name:' "$CHART_DIR/Chart.yaml" | head -1 | awk '{print $2}')
          BASE_VERSION=$(grep -E '^version:' "$CHART_DIR/Chart.yaml" | head -1 | awk '{print $2}' | tr -d '"')

          # Pick the stable channel tag — versioned for vX.Y.Z, "main" for main builds.
          # GIT_TAG comes from determine-tags (git tag --points-at the verified SHA).
          if [ -n "$GIT_TAG" ]; then
            CHANNEL_VERSION="${GIT_TAG#v}"
          else
            CHANNEL_VERSION="${BASE_VERSION}-main"
          fi

          # SHA-pinned semver build metadata (not a separate prerelease — keeps
          # the channel tag sortable while still exposing the SHA).
          SHA_VERSION="${BASE_VERSION}-sha.${SHA_SHORT}"

          echo "chart_dir=$CHART_DIR" >> $GITHUB_OUTPUT
          echo "chart_name=$CHART_NAME" >> $GITHUB_OUTPUT
          echo "repo_lower=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "channel_version=$CHANNEL_VERSION" >> $GITHUB_OUTPUT
          echo "sha_version=$SHA_VERSION" >> $GITHUB_OUTPUT

          echo "📦 Chart: $CHART_NAME"
          echo "🏷️  Channel version: $CHANNEL_VERSION"
          echo "🏷️  SHA version: $SHA_VERSION"

      - name: Lint Helm chart
        run: helm lint ${{ steps.chart.outputs.chart_dir }}

      - name: Package + push SHA-pinned chart
        env:
          CHART_DIR: ${{ steps.chart.outputs.chart_dir }}
          CHART_NAME: ${{ steps.chart.outputs.chart_name }}
          REPO_LOWER: ${{ steps.chart.outputs.repo_lower }}
          SHA_VERSION: ${{ steps.chart.outputs.sha_version }}
          SHA_SHORT: ${{ needs.determine-tags.outputs.sha_short }}
        run: |
          mkdir -p packaged-sha
          helm package "$CHART_DIR" \
            --version "$SHA_VERSION" \
            --app-version "$SHA_SHORT" \
            -d packaged-sha
          ls -la packaged-sha
          helm push "packaged-sha/${CHART_NAME}-${SHA_VERSION}.tgz" "oci://ghcr.io/${REPO_LOWER}/charts"

      - name: Package + push channel chart
        env:
          CHART_DIR: ${{ steps.chart.outputs.chart_dir }}
          CHART_NAME: ${{ steps.chart.outputs.chart_name }}
          REPO_LOWER: ${{ steps.chart.outputs.repo_lower }}
          CHANNEL_VERSION: ${{ steps.chart.outputs.channel_version }}
          SHA_SHORT: ${{ needs.determine-tags.outputs.sha_short }}
        run: |
          mkdir -p packaged-channel
          helm package "$CHART_DIR" \
            --version "$CHANNEL_VERSION" \
            --app-version "$SHA_SHORT" \
            -d packaged-channel
          ls -la packaged-channel
          helm push "packaged-channel/${CHART_NAME}-${CHANNEL_VERSION}.tgz" "oci://ghcr.io/${REPO_LOWER}/charts"

  build-complete:
    name: ✅ Build Complete
    runs-on: ubuntu-latest
    needs: [determine-tags, build-backend, build-frontend, publish-helm]
    if: always() && needs.determine-tags.outputs.should_build == 'true'
    steps:
      - name: Report completion
        run: |
          BACKEND="${{ needs.build-backend.result }}"
          FRONTEND="${{ needs.build-frontend.result }}"
          HELM="${{ needs.publish-helm.result }}"
          PUBLISH_HELM="${{ needs.determine-tags.outputs.publish_helm }}"

          # Helm only runs on main/tag builds; "skipped" is fine on feature branches.
          if [[ "$PUBLISH_HELM" == "true" ]]; then
            HELM_OK="$HELM"
          else
            HELM_OK="success"
          fi

          if [[ "$BACKEND" == "success" && "$FRONTEND" == "success" && "$HELM_OK" == "success" ]]; then
            echo "✅ All artifacts built and published successfully!"
            echo "📦 Backend tags: ${{ needs.determine-tags.outputs.backend_tags }}"
            echo "📦 Frontend tags: ${{ needs.determine-tags.outputs.frontend_tags }}"
            if [[ "$PUBLISH_HELM" == "true" ]]; then
              echo "📜 Helm chart published to oci://ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/charts"
            fi
          else
            echo "❌ Some builds failed:"
            echo "  Backend:    $BACKEND"
            echo "  Frontend:   $FRONTEND"
            echo "  Helm chart: $HELM (publish_helm=$PUBLISH_HELM)"
            exit 1
          fi
