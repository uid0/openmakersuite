# Canonical DATABASE_URL Secret. Backend, Celery, Flower, and the migrations
# Job all read DATABASE_URL from here, so swapping bundled vs external
# Postgres is a one-Secret change. The default value matches the bundled
# StatefulSet credentials in secret-postgres.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: oms-database
  namespace: openmakersuite
  labels:
    app.kubernetes.io/name: openmakersuite
    app.kubernetes.io/part-of: openmakersuite
type: Opaque
stringData:
  database-url: "postgresql://makerspace:REPLACE_ME_WITH_32_CHAR_RANDOM_STRING@oms-postgresql:5432/makerspace_inventory"
