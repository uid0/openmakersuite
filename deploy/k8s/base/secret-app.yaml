# Application Secret consumed by the Django backend, Celery, and Flower.
# Replace placeholder values before applying, or replace this Secret entirely
# with one you manage out-of-band (e.g. SealedSecrets, External Secrets,
# Vault). The Deployments reference it as `optional: true` so a missing
# Secret does not block a rollout, but SECRET_KEY is required to actually
# serve traffic.
apiVersion: v1
kind: Secret
metadata:
  name: oms-secrets
  namespace: openmakersuite
  labels:
    app.kubernetes.io/name: openmakersuite
    app.kubernetes.io/part-of: openmakersuite
  annotations:
    # Keep this Secret if the bundle that defined it is removed, so that a
    # regenerated SECRET_KEY does not invalidate every active session.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_ME_WITH_50_CHAR_RANDOM_STRING"
  SENTRY_DSN: ""
  REACT_APP_SENTRY_DSN: ""
  MQTT_BROKER_USERNAME: ""
  MQTT_BROKER_PASSWORD: ""
  EMQX_DASHBOARD_PASSWORD: ""
  EMQX_API_KEY: ""
  EMQX_API_SECRET: ""
  FORGEKEY_FIRMWARE_SIGNING_KEY: ""
  EMAIL_HOST: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  DEFAULT_FROM_EMAIL: ""
