# Pre-commit hooks for code quality and consistency
# See https://pre-commit.com for more information

repos:
  # General file cleanups
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: migrations/
      - id: end-of-file-fixer
        exclude: migrations/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending

  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.13
        exclude: migrations/

  # Python import sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        exclude: migrations/
        args: ["--profile", "black", "--line-length", "100"]

  # Python linting
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        exclude: migrations/
        args: [
        "--config","./backend/.flake8"
        ]

  # Security checks
  # Same bandit version, scope and skips as the root .pre-commit-config.yaml
  # hook and CI (see the comments there). pre-commit runs hooks from the repo
  # root even with `-c backend/.pre-commit-config.yaml`, so paths are
  # root-relative. pass_filenames is off because bandit's argparse takes its
  # targets as one positional group: filenames appended after `-r <dir> -s ...`
  # are rejected as "unrecognized arguments".
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        files: ^backend/
        exclude: ^(backend/.*migrations/|backend/.*tests.*)
        pass_filenames: false
        args:
          [
            "-r",
            "-s",
            "B101,B105,B106,B308",
            "-x",
            "*/tests/*,*/migrations/*",
            "backend",
          ]

  # Django-specific checks
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.16.0
    hooks:
      - id: django-upgrade
        args: ["--target-version", "4.2"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

# CI configuration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
