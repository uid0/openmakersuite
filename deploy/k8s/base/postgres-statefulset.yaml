apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oms-postgresql
  namespace: openmakersuite
  labels:
    app.kubernetes.io/name: openmakersuite
    app.kubernetes.io/part-of: openmakersuite
    app.kubernetes.io/component: postgresql
spec:
  serviceName: oms-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openmakersuite
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openmakersuite
        app.kubernetes.io/part-of: openmakersuite
        app.kubernetes.io/component: postgresql
    spec:
      containers:
        - name: postgres
          image: "postgres:15.17-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "makerspace_inventory"
            - name: POSTGRES_USER
              value: "makerspace"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oms-postgresql
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - makerspace
                - -d
                - makerspace_inventory
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - makerspace
                - -d
                - makerspace_inventory
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
