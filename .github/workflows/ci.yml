name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# What follows the changes job uses path filters to skip expensive jobs on
# doc-only changes. Branch protection still requires "✅ CI Complete", which
# treats skipped jobs as a pass when they were correctly skipped.

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      deploy: ${{ steps.filter.outputs.deploy }}
      security: ${{ steps.filter.outputs.security }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On push events the action diffs against the previous commit; on PRs
          # against the merge base. base/ref is auto-detected.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              - '.pre-commit-config.yaml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - 'backend/**'
              - 'frontend/**'
              - 'docker-compose.yml'
              - 'docker-compose.prod.yml'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            security:
              - 'backend/**'
              - 'frontend/**'
              - '.gitleaks.toml'
              - '.github/workflows/ci.yml'

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install lint dependencies
        run: |
          cd backend
          pip install --upgrade pip
          # Pull just the lint tools we need; mirrors versions in requirements-dev.txt.
          pip install black isort flake8

      - name: Check code formatting with black
        run: cd backend && black --check .

      - name: Check import sorting with isort
        run: cd backend && isort --check-only .

      - name: Lint with flake8
        run: cd backend && flake8 .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_makerspace_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: |
          cd backend
          python manage.py migrate --no-input
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: 1
          ALLOWED_HOSTS: localhost,127.0.0.1
          REDIS_URL: redis://localhost:6379/0

      - name: Run tests with coverage
        run: |
          cd backend
          pytest -n auto
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_makerspace_inventory
          SECRET_KEY: test-secret-key-for-ci-only
          DEBUG: 1
          ALLOWED_HOSTS: localhost,127.0.0.1
          REDIS_URL: redis://localhost:6379/0

      - name: Verify coverage file exists
        run: |
          if [ ! -f backend/coverage.xml ]; then
            echo "❌ backend/coverage.xml not found!"
            ls -la backend/ | grep -i coverage || echo "No coverage files found"
            exit 1
          fi
          echo "✓ Coverage file verified"
          ls -lh backend/coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          name: backend-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Verify package-lock.json is in sync
        run: |
          cd frontend
          # Check if package-lock.json exists
          if [ ! -f "package-lock.json" ]; then
            echo "❌ Error: package-lock.json not found"
            exit 1
          fi
          echo "🔍 Verifying package-lock.json is in sync with package.json..."
          # --ignore-scripts skips postinstall (patch-package), which isn't on
          # PATH before the real install. Lock sync doesn't need scripts.
          npm ci --dry-run --ignore-scripts || (echo "❌ package-lock.json is out of sync with package.json. Run 'npm install' in frontend/ and commit the updated lock file." && exit 1)
          echo "✅ package-lock.json is in sync"

      - name: Install dependencies
        run: |
          cd frontend
          # Force IPv4 only for npm operations (via .npmrc and NODE_OPTIONS)
          npm ci --verbose
          # Verify installation
          ls -la node_modules/.bin/react-scripts || (echo "❌ react-scripts not found after npm ci!" && exit 1)
          npm ls @mantine/core @mantine/modals html5-qrcode recharts react-grid-layout
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"

      - name: Run tests with coverage
        run: |
          cd frontend
          npm run test:ci:coverage
        env:
          CI: true
          NODE_OPTIONS: "--dns-result-order=ipv4first"

      - name: Build production bundle
        run: |
          cd frontend
          npm run build
        env:
          CI: false
          NODE_OPTIONS: "--dns-result-order=ipv4first"

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      - name: Run Playwright E2E tests
        continue-on-error: true
        run: |
          cd frontend
          python3 ../scripts/serve-spa.py build 3000 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          env -u CI npm run test:e2e
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          PLAYWRIGHT_API_URL: http://localhost:8000/api

      - name: Verify coverage files exist
        run: |
          cd frontend
          if [ ! -f coverage/clover.xml ]; then
            echo "❌ clover.xml not found!"
            exit 1
          fi
          if [ ! -f coverage/lcov.info ]; then
            echo "❌ lcov.info not found!"
            exit 1
          fi
          echo "✓ Coverage files verified"
          ls -lh coverage/clover.xml coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/clover.xml,./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docker == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pre-cleanup stale volumes
        run: |
          docker compose down -v 2>/dev/null || true
          docker container prune -f 2>/dev/null || true
          docker volume rm openmakersuite_media_volume openmakersuite_static_volume openmakersuite_postgres_data 2>/dev/null || true
          docker volume prune -f 2>/dev/null || true

      - name: Build and test with docker compose
        run: |
          # Start services
          docker compose up -d --build

          # Wait for services to be healthy
          timeout 300 bash -c 'while [[ "$(docker compose ps -q | xargs docker inspect -f "{{.State.Health.Status}}" 2>/dev/null | grep -v healthy | wc -l)" != "0" ]]; do sleep 5; done'

          # Run migrations
          docker compose exec -T backend python manage.py migrate --no-input

          # Run tests in Docker environment
          docker compose exec -T backend pytest -v
        env:
          POSTGRES_PASSWORD: test_password_for_ci_only

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          docker system prune -f

  security:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.security == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for gitleaks

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Run bandit security check
        run: |
          cd backend
          # Exclude test files and migrations
          # Skip B101 (assert_used - acceptable in tests) and B106 (hardcoded_password_funcarg - acceptable in test fixtures)
          # Pattern */tests/* matches all test directories, */migrations/* matches all migration directories
          bandit -r . -x "*/tests/*,*/migrations/*" -s B101,B106 -f json -o bandit-report.json || true
          bandit -r . -x "*/tests/*,*/migrations/*" -s B101,B106

      - name: Check dependencies for vulnerabilities
        run: |
          cd backend
          echo "🔍 Checking for vulnerable dependencies with multiple tools..."

          # Use pip-audit as primary tool (more reliable for CI)
          if pip-audit --format=json --output=safety-report.json --desc; then
            echo "✅ pip-audit completed successfully"
            pip-audit --desc  # Show readable output
          else
            echo "⚠️  pip-audit failed, trying safety as fallback..."

            # Use safety check (deprecated but works without auth)
            if safety check --json --output=safety-report.json 2>/dev/null; then
              echo "✅ Safety check completed successfully"
              safety check --short-report 2>/dev/null || safety check
            else
              echo "⚠️  Both pip-audit and safety encountered issues"
              echo "Creating minimal report for CI continuation..."
              echo '{"vulnerabilities": [], "info": "Vulnerability scanning tools encountered compatibility issues"}' > safety-report.json
            fi
          fi

      - name: Install gitleaks
        run: |
          wget https://github.com/zricethezav/gitleaks/releases/download/v8.18.0/gitleaks_8.18.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks_8.18.0_linux_x64.tar.gz

      - name: Run gitleaks scan
        run: |
          # Run gitleaks with our configuration (works with both GitHub Actions and act)
          if [ -f .gitleaks.toml ]; then
            echo "✓ Using custom gitleaks configuration (.gitleaks.toml)"
            gitleaks detect --config .gitleaks.toml --verbose --no-git
          else
            echo "⚠ Using default gitleaks configuration (no .gitleaks.toml found)"
            gitleaks detect --verbose --no-git
          fi
          echo "✅ Gitleaks scan completed successfully"

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json
            backend/safety-report.json

  deploy-validation:
    name: Deploy Validation (Helm + K8s)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy == 'true'

    env:
      HELM_VERSION: v3.16.2
      KUBECONFORM_VERSION: 0.6.7
      KUBE_VERSION: "1.29.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          sudo mv kubeconform /usr/local/bin/
          kubeconform -v

      - name: helm lint (strict)
        run: helm lint --strict deploy/helm/openmakersuite

      - name: helm template — render configurations
        run: |
          mkdir -p /tmp/render
          CHART=deploy/helm/openmakersuite

          echo "::group::default (bundled DB + Redis)"
          helm template oms "$CHART" > /tmp/render/helm-default.yaml
          echo "::endgroup::"

          echo "::group::external database"
          helm template oms "$CHART" \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql://oms:secret@db.example.com:5432/oms \
            > /tmp/render/helm-extdb.yaml
          echo "::endgroup::"

          echo "::group::external redis"
          helm template oms "$CHART" \
            --set redis.enabled=false \
            --set externalRedis.url=redis://redis.example.com:6379/0 \
            > /tmp/render/helm-extredis.yaml
          echo "::endgroup::"

          echo "::group::ingress enabled"
          helm template oms "$CHART" \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            > /tmp/render/helm-ingress.yaml
          echo "::endgroup::"

          echo "::group::persistence disabled"
          helm template oms "$CHART" \
            --set persistence.static.enabled=false \
            --set persistence.media.enabled=false \
            > /tmp/render/helm-nopersist.yaml
          echo "::endgroup::"

          for f in /tmp/render/helm-*.yaml; do
            test -s "$f" || { echo "❌ empty render: $f"; exit 1; }
          done

      - name: helm template — assert configuration shape
        run: |
          fail=0
          assert_kind_count() {
            local file="$1" kind="$2" expected="$3"
            local actual
            actual=$(grep -cE "^kind: ${kind}\$" "$file" || true)
            if [ "$actual" != "$expected" ]; then
              echo "❌ $file: expected $expected '$kind' resource(s), got $actual"
              fail=1
            else
              echo "✓ $file: $actual '$kind' resource(s)"
            fi
          }

          # Default: bundled postgres StatefulSet, no Ingress, both PVCs present.
          assert_kind_count /tmp/render/helm-default.yaml StatefulSet 1
          assert_kind_count /tmp/render/helm-default.yaml Ingress 0
          assert_kind_count /tmp/render/helm-default.yaml PersistentVolumeClaim 2

          # External DB: no bundled StatefulSet.
          assert_kind_count /tmp/render/helm-extdb.yaml StatefulSet 0

          # External Redis: bundled redis Deployment is gone. Verify by name.
          if awk '/^kind: Deployment$/{f=1; next} /^---$/{f=0} f && /^  name: .*-redis$/' \
               /tmp/render/helm-extredis.yaml | grep -q .; then
            echo "❌ helm-extredis.yaml: bundled redis Deployment is still present"
            fail=1
          else
            echo "✓ helm-extredis.yaml: bundled redis Deployment removed"
          fi

          # Ingress enabled: exactly one Ingress resource.
          assert_kind_count /tmp/render/helm-ingress.yaml Ingress 1

          # Persistence disabled: no PVCs.
          assert_kind_count /tmp/render/helm-nopersist.yaml PersistentVolumeClaim 0

          exit $fail

      - name: kubectl kustomize — render k8s bundles
        run: |
          mkdir -p /tmp/render
          kubectl kustomize deploy/k8s/base \
            > /tmp/render/k8s-base.yaml
          kubectl kustomize deploy/k8s/overlays/external-services \
            > /tmp/render/k8s-external.yaml

          for f in /tmp/render/k8s-*.yaml; do
            test -s "$f" || { echo "❌ empty render: $f"; exit 1; }
          done

      - name: kubectl kustomize — assert overlay shape
        run: |
          fail=0
          # Base bundle ships a postgres StatefulSet; overlay should drop it.
          base_ss=$(grep -cE "^kind: StatefulSet\$" /tmp/render/k8s-base.yaml || true)
          ext_ss=$(grep -cE "^kind: StatefulSet\$" /tmp/render/k8s-external.yaml || true)
          if [ "$base_ss" -lt 1 ]; then
            echo "❌ k8s base bundle is missing the postgres StatefulSet (got $base_ss)"
            fail=1
          fi
          if [ "$ext_ss" != "0" ]; then
            echo "❌ external-services overlay still emits a StatefulSet (got $ext_ss)"
            fail=1
          fi

          # Overlay should drop the bundled redis Deployment too.
          if awk '/^kind: Deployment$/{f=1; next} /^---$/{f=0} f && /^  name: .*-redis$/' \
               /tmp/render/k8s-external.yaml | grep -q .; then
            echo "❌ external-services overlay still emits a redis Deployment"
            fail=1
          fi

          [ "$fail" = 0 ] && echo "✓ external-services overlay drops bundled DB + Redis workloads"
          exit $fail

      - name: kubeconform — validate all rendered manifests
        run: |
          # Validate every render against the targeted Kubernetes version.
          # `-strict` flags duplicate/unknown fields; `-ignore-missing-schemas`
          # only kicks in for CRDs, none of which we ship from these manifests.
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -kubernetes-version "${KUBE_VERSION}" \
            -summary \
            /tmp/render/helm-default.yaml \
            /tmp/render/helm-extdb.yaml \
            /tmp/render/helm-extredis.yaml \
            /tmp/render/helm-ingress.yaml \
            /tmp/render/helm-nopersist.yaml \
            /tmp/render/k8s-base.yaml \
            /tmp/render/k8s-external.yaml

      - name: Upload rendered manifests on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-renders
          path: /tmp/render/

  # Aggregator that branch protection points at. Treats "skipped" as a pass so
  # path-filter skips don't block doc-only PRs. Treats "failure" or "cancelled"
  # as a fail.
  ci-complete:
    name: ✅ CI Complete
    runs-on: ubuntu-latest
    needs: [changes, backend-lint, backend-tests, frontend-tests, docker-build, security, deploy-validation]
    if: always()
    steps:
      - name: Check all jobs succeeded or were skipped
        run: |
          ok() {
            # success or skipped both pass; cancelled/failure fails.
            [[ "$1" == "success" || "$1" == "skipped" ]]
          }

          BACKEND_LINT="${{ needs.backend-lint.result }}"
          BACKEND="${{ needs.backend-tests.result }}"
          FRONTEND="${{ needs.frontend-tests.result }}"
          DOCKER="${{ needs.docker-build.result }}"
          SECURITY="${{ needs.security.result }}"
          DEPLOY="${{ needs.deploy-validation.result }}"

          echo "Backend lint:  $BACKEND_LINT"
          echo "Backend tests: $BACKEND"
          echo "Frontend:      $FRONTEND"
          echo "Docker:        $DOCKER"
          echo "Security:      $SECURITY"
          echo "Deploy:        $DEPLOY"

          fail=0
          for r in "$BACKEND_LINT" "$BACKEND" "$FRONTEND" "$DOCKER" "$SECURITY" "$DEPLOY"; do
            ok "$r" || fail=1
          done

          if [ $fail -eq 0 ]; then
            echo "✅ All required CI checks passed (or were correctly skipped)"
            exit 0
          else
            echo "❌ One or more required jobs failed or were cancelled"
            exit 1
          fi
