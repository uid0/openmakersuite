{% extends "admin/change_form.html" %}
{% load i18n admin_urls static %}

{% block submit_buttons_bottom %}
{{ block.super }}
{% if duplicate_url %}
<div class="submit-row" style="background: #f8f9fa; border-top: 1px solid #ddd; margin-top: 10px;">
    <a href="{{ duplicate_url }}" class="button" style="background: #28a745; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; display: inline-block;">
        ➕ Add Another Asset of this Type
    </a>
    <p class="help" style="margin-top: 10px; color: #666;">
        Duplicate this asset with a new serial number. All other information will be copied.
    </p>
</div>
{% endif %}
{% endblock %}
