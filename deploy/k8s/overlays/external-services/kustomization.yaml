apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay for installs that point at managed PostgreSQL and Redis instead
# of the bundled in-cluster services. Edit secret-database-patch.yaml and
# secret-redis-patch.yaml with your real connection strings before applying.
#
#   kubectl apply -k deploy/k8s/overlays/external-services

namespace: openmakersuite

resources:
  - ../../base

# Drop the bundled stateful workloads — the managed services replace them —
# and overlay the connection-string Secrets with the external values.
patches:
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: oms-postgresql
        namespace: openmakersuite
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: oms-postgresql
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: oms-postgresql
        namespace: openmakersuite
    target:
      version: v1
      kind: Service
      name: oms-postgresql
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: oms-postgresql
        namespace: openmakersuite
    target:
      version: v1
      kind: Secret
      name: oms-postgresql
  - patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oms-redis
        namespace: openmakersuite
    target:
      group: apps
      version: v1
      kind: Deployment
      name: oms-redis
  - patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: oms-redis
        namespace: openmakersuite
    target:
      version: v1
      kind: Service
      name: oms-redis
  - path: secret-database-patch.yaml
  - path: secret-redis-patch.yaml
