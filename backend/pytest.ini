[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --cov=analytics
    --cov=climate
    --cov=config
    --cov=customization
    --cov=dashboard
    --cov=devices
    --cov=donations
    --cov=electrical_circuits
    --cov=forgekey
    --cov=index_cards
    --cov=inventory
    --cov=location_checkins
    --cov=loto
    --cov=maintenance_orders
    --cov=maker_boxes
    --cov=membership
    --cov=notifications
    --cov=preventive_maintenance
    --cov=project_storage
    --cov=reorder_queue
    --cov=scanner
    --cov=vendors
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    --verbose
    --strict-markers
    --disable-warnings
testpaths =
    analytics/tests
    climate/tests
    config/tests
    customization
    dashboard/tests
    devices/tests
    donations/tests
    electrical_circuits/tests
    forgekey/tests
    index_cards/tests
    inventory/tests
    location_checkins/tests
    loto/tests
    maintenance_orders/tests
    maker_boxes/tests
    membership/tests
    notifications/tests.py
    preventive_maintenance/tests
    project_storage/tests
    reorder_queue/tests
    scanner/tests
    vendors/tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
